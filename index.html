<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2541;
    --cream: #F5F3EE;
    --gold: #E3A857;
    --teal: #4C9F94;
    --slate: #6B7A99;
    --hero-bg: var(--navy);
    --hero-accent: var(--gold);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Work Sans', sans-serif;
    background: var(--cream);
    color: var(--navy);
    min-height: 100vh;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Search */
  .search-bar {
    display: flex;
    gap: 8px;
    padding: 20px 20px 0;
  }

  .search-bar input {
    flex: 1;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    border: 1.5px solid #DDD8CC;
    border-radius: 10px;
    background: #fff;
    color: var(--navy);
    outline: none;
  }

  .search-bar input:focus {
    border-color: var(--slate);
  }

  .search-bar button {
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: var(--navy);
    color: var(--cream);
    cursor: pointer;
  }

  .search-bar button:active { opacity: 0.85; }

  .locate-row {
    padding: 10px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .locate-link {
    font-size: 14px;
    color: var(--slate);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .unit-toggle {
    font-size: 14px;
    color: var(--slate);
    background: none;
    border: 1px solid #DDD8CC;
    border-radius: 20px;
    padding: 4px 12px;
    cursor: pointer;
  }

  .results {
    margin: 8px 20px 0;
    background: #fff;
    border: 1.5px solid #DDD8CC;
    border-radius: 10px;
    overflow: hidden;
    display: none;
  }

  .results.show { display: block; }

  .results button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: none;
    border: none;
    border-bottom: 1px solid #EEEAE0;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    color: var(--navy);
    cursor: pointer;
  }

  .results button:last-child { border-bottom: none; }
  .results button:hover { background: #F9F7F2; }

  /* Hero */
  .hero {
    margin: 20px 20px 0;
    border-radius: 20px;
    background: var(--hero-bg);
    color: var(--cream);
    padding: 36px 28px 30px;
    text-align: center;
    transition: background 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .hero-glyph {
    width: 56px;
    height: 56px;
    margin: 0 auto 4px;
  }

  .hero-location {
    font-size: 15px;
    opacity: 0.85;
    margin: 0 0 2px;
  }

  .hero-temp {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 88px;
    line-height: 1;
    margin: 4px 0 0;
    letter-spacing: -0.02em;
  }

  .hero-condition {
    font-size: 17px;
    margin: 6px 0 0;
    color: var(--hero-accent);
  }

  .hero-meta {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 24px;
    font-size: 13px;
    opacity: 0.8;
  }

  /* Hourly */
  .section-label {
    font-size: 14px;
    color: var(--slate);
    margin: 26px 20px 10px;
  }

  .hourly-strip {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    padding: 0 20px 4px;
    scrollbar-width: none;
  }

  .hourly-strip::-webkit-scrollbar { display: none; }

  .hour-item {
    flex: 0 0 auto;
    text-align: center;
    min-width: 42px;
  }

  .hour-item .time {
    font-size: 13px;
    color: var(--slate);
    margin-bottom: 8px;
  }

  .hour-item svg { width: 22px; height: 22px; margin-bottom: 8px; }

  .hour-item .temp {
    font-size: 15px;
    font-weight: 500;
  }

  /* Daily */
  .daily-list {
    margin: 6px 20px 30px;
  }

  .daily-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #E5E1D6;
    gap: 12px;
  }

  .daily-row:last-child { border-bottom: none; }

  .daily-row .day {
    width: 84px;
    font-size: 15px;
  }

  .daily-row svg { width: 20px; height: 20px; flex: 0 0 auto; }

  .daily-row .cond {
    flex: 1;
    font-size: 14px;
    color: var(--slate);
  }

  .daily-row .range {
    font-size: 15px;
    text-align: right;
    white-space: nowrap;
  }

  .daily-row .range .lo { color: var(--slate); }

  .status {
    text-align: center;
    padding: 60px 20px;
    color: var(--slate);
    font-size: 15px;
  }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .hero { transition: none; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="search-bar">
    <input type="text" id="cityInput" placeholder="Search a city" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="locate-row">
    <button class="locate-link" id="locateBtn">Use my location</button>
    <button class="unit-toggle" id="unitToggle">°C</button>
  </div>

  <div class="results" id="results"></div>

  <div id="content">
    <div class="status" id="status">Search for a city or use your location to see the forecast.</div>
  </div>

</div>

<script>
  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const locateBtn = document.getElementById('locateBtn');
  const unitToggle = document.getElementById('unitToggle');
  const resultsEl = document.getElementById('results');
  const contentEl = document.getElementById('content');

  let unit = 'celsius'; // or fahrenheit
  let lastCoords = null; // { lat, lon, name }

  // ---- Weather code -> description + glyph ----
  function describeCode(code) {
    if (code === 0) return { text: 'Clear sky', kind: 'sun' };
    if ([1, 2].includes(code)) return { text: 'Partly cloudy', kind: 'cloud-sun' };
    if (code === 3) return { text: 'Overcast', kind: 'cloud' };
    if ([45, 48].includes(code)) return { text: 'Foggy', kind: 'fog' };
    if ([51, 53, 55, 56, 57].includes(code)) return { text: 'Drizzle', kind: 'rain' };
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: 'Rain', kind: 'rain' };
    if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: 'Snow', kind: 'snow' };
    if ([95, 96, 99].includes(code)) return { text: 'Thunderstorm', kind: 'storm' };
    return { text: 'Unknown', kind: 'cloud' };
  }

  function glyphFor(kind, color) {
    const c = color || 'currentColor';
    switch (kind) {
      case 'sun':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/></svg>`;
      case 'cloud-sun':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="8" cy="9" r="3.2"/><path d="M8 2.5v2M13.5 4.5l-1.4 1.4M2.5 9h2" stroke-linecap="round"/><path d="M6 20h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 20Z"/></svg>`;
      case 'cloud':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 18h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 18Z"/></svg>`;
      case 'rain':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 14h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 14Z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3" stroke-linecap="round"/></svg>`;
      case 'snow':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 13h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 13Z"/><path d="M9 18v4M9 19l-1.5 1M9 19l1.5 1M15 18v4M15 19l-1.5 1M15 19l1.5 1" stroke-linecap="round"/></svg>`;
      case 'storm':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 12h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 12Z"/><path d="M13 15l-3 5h3l-2 4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      case 'fog':
        return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M4 9h13M4 13h16M4 17h11" stroke-linecap="round"/></svg>`;
      default:
        return '';
    }
  }

  function heroColorsFor(kind) {
    if (kind === 'sun' || kind === 'cloud-sun') return { bg: '#3A3054', accent: '#E3A857' };
    if (kind === 'rain' || kind === 'storm' || kind === 'drizzle') return { bg: '#1C2541', accent: '#4C9F94' };
    if (kind === 'snow') return { bg: '#2B3A55', accent: '#F5F3EE' };
    return { bg: '#1C2541', accent: '#6B7A99' };
  }

  function fmtTemp(celsiusValue) {
    if (celsiusValue === null || celsiusValue === undefined) return '--';
    const v = unit === 'celsius' ? celsiusValue : (celsiusValue * 9/5 + 32);
    return Math.round(v) + '°';
  }

  function dayLabel(dateStr, index) {
    if (index === 0) return 'Today';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short' });
  }

  function hourLabel(isoStr) {
    const d = new Date(isoStr);
    let h = d.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ampm;
  }

  // ---- Geocoding search ----
  async function searchCity(query) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    return data.results || [];
  }

  searchBtn.addEventListener('click', doSearch);
  cityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const q = cityInput.value.trim();
    if (!q) return;
    resultsEl.innerHTML = '<button disabled>Searching…</button>';
    resultsEl.classList.add('show');
    try {
      const matches = await searchCity(q);
      if (matches.length === 0) {
        resultsEl.innerHTML = '<button disabled>No matches found</button>';
        return;
      }
      resultsEl.innerHTML = '';
      matches.forEach(m => {
        const label = [m.name, m.admin1, m.country].filter(Boolean).join(', ');
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          resultsEl.classList.remove('show');
          cityInput.value = m.name;
          loadWeather(m.latitude, m.longitude, m.name);
        });
        resultsEl.appendChild(btn);
      });
    } catch (err) {
      resultsEl.innerHTML = '<button disabled>Something went wrong. Try again.</button>';
    }
  }

  // ---- Geolocation ----
  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      showStatus("Your browser doesn't support location. Try searching instead.");
      return;
    }
    showStatus('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude, 'Your location'),
      () => showStatus("Couldn't get your location. Try searching for a city instead.")
    );
  });

  unitToggle.addEventListener('click', () => {
    unit = unit === 'celsius' ? 'fahrenheit' : 'celsius';
    unitToggle.textContent = unit === 'celsius' ? '°C' : '°F';
    if (lastCoords) loadWeather(lastCoords.lat, lastCoords.lon, lastCoords.name);
  });

  function showStatus(msg) {
    contentEl.innerHTML = `<div class="status">${msg}</div>`;
  }

  // ---- Fetch + render weather ----
  async function loadWeather(lat, lon, name) {
    lastCoords = { lat, lon, name };
    showStatus('Loading forecast…');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m` +
      `&hourly=temperature_2m,weather_code` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
      `&temperature_unit=celsius&timezone=auto&forecast_days=6`;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      render(data, name);
    } catch (err) {
      showStatus("Couldn't load the forecast. Check your connection and try again.");
    }
  }

  function render(data, name) {
    const current = data.current;
    const desc = describeCode(current.weather_code);
    const colors = heroColorsFor(desc.kind);

    // Next 8 hours starting from current hour
    const nowIso = data.current.time;
    const hourlyTimes = data.hourly.time;
    let startIdx = hourlyTimes.findIndex(t => t >= nowIso);
    if (startIdx === -1) startIdx = 0;
    const hours = [];
    for (let i = startIdx; i < startIdx + 8 && i < hourlyTimes.length; i++) {
      hours.push({
        time: hourlyTimes[i],
        temp: data.hourly.temperature_2m[i],
        code: data.hourly.weather_code[i]
      });
    }

    const days = data.daily.time.map((t, i) => ({
      date: t,
      code: data.daily.weather_code[i],
      hi: data.daily.temperature_2m_max[i],
      lo: data.daily.temperature_2m_min[i]
    }));

    const hourlyHtml = hours.map(h => {
      const d = describeCode(h.code);
      return `
        <div class="hour-item">
          <div class="time">${hourLabel(h.time)}</div>
          ${glyphFor(d.kind, '#1C2541')}
          <div class="temp">${fmtTemp(h.temp)}</div>
        </div>`;
    }).join('');

    const dailyHtml = days.map((d, i) => {
      const desc = describeCode(d.code);
      return `
        <div class="daily-row">
          <div class="day">${dayLabel(d.date, i)}</div>
          ${glyphFor(desc.kind, '#6B7A99')}
          <div class="cond">${desc.text}</div>
          <div class="range"><span>${fmtTemp(d.hi)}</span> <span class="lo">${fmtTemp(d.lo)}</span></div>
        </div>`;
    }).join('');

    contentEl.innerHTML = `
      <div class="hero" style="--hero-bg:${colors.bg}; background:${colors.bg}">
        <div class="hero-glyph" style="color:${colors.accent}">${glyphFor(desc.kind, colors.accent)}</div>
        <p class="hero-location">${name}</p>
        <p class="hero-temp">${fmtTemp(current.temperature_2m)}</p>
        <p class="hero-condition" style="color:${colors.accent}">${desc.text}</p>
        <div class="hero-meta">
          <span>Feels like ${fmtTemp(current.apparent_temperature)}</span>
          <span>Wind ${Math.round(current.wind_speed_10m)} km/h</span>
        </div>
      </div>

      <p class="section-label">Next hours</p>
      <div class="hourly-strip">${hourlyHtml}</div>

      <p class="section-label">Next few days</p>
      <div class="daily-list">${dailyHtml}</div>
    `;
  }
</script>

</body>
</html>
