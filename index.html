<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tide &amp; Time — Fishing Conditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2541;
    --cream: #F5F3EE;
    --gold: #E3A857;
    --teal: #4C9F94;
    --slate: #6B7A99;

    /* Surface/border/text tokens — these are what actually flip between light and dark;
       --navy/--cream/etc above stay fixed brand accents (buttons, selected states). */
    --bg: var(--cream);
    --surface: #fff;
    --surface-alt: #F9F7F2;
    --surface-alt2: #F0ECE0;
    --surface-alt2-hover: #E0DACB;
    --border: #DDD8CC;
    --border-soft: #E8E3D6;
    --border-faint: #EEEAE0;
    --border-faint2: #F0ECE0;
    --track-bg: #DCE2EC;
    --today-tint: #F0F7F5;
    --today-tint-selected: #E4EFEC;
    --text: var(--navy);
    --text-muted: var(--slate);
    /* Buttons/selected-states that use --navy as a fill (not text) route through this instead,
       since plain navy barely differs from the dark-mode card surface below — this stays navy
       in light mode but brightens in dark mode so those elements still read as "accented". */
    --accent-strong: var(--navy);
  }

  [data-theme="dark"] {
    --bg: #12172A;
    --surface: #1B2136;
    --surface-alt: #212942;
    --surface-alt2: #262F4A;
    --surface-alt2-hover: #2E3856;
    --border: #303B58;
    --border-soft: #2A3350;
    --border-faint: #262F49;
    --border-faint2: #232B44;
    --track-bg: #29334E;
    --today-tint: #16332E;
    --today-tint-selected: #1C3E37;
    --text: #E9ECF5;
    --text-muted: #96A2C4;
    --accent-strong: #3E5285;
  }

  * { box-sizing: border-box; }

  body { margin: 0; font-family: 'Work Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }

  .app-header { position: relative; display: flex; justify-content: flex-end; padding: 14px 20px 0; }
  .settings-btn {
    display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted);
    cursor: pointer; padding: 0;
  }
  .settings-btn:hover { background: var(--surface-alt); }
  .settings-btn svg { width: 18px; height: 18px; }

  .settings-popup {
    position: absolute; top: 44px; right: 20px; width: 230px; z-index: 50;
    background: var(--surface); border: 1px solid var(--border-faint); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(28,37,65,0.15); padding: 14px 16px;
  }
  .settings-popup[hidden] { display: none; }
  .settings-title { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--text); }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13.5px; color: var(--text); }

  .switch { width: 42px; height: 24px; border-radius: 12px; background: var(--surface-alt2); border: none; position: relative; cursor: pointer; padding: 0; flex: 0 0 auto; transition: background 0.15s ease; }
  .switch .switch-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch.on { background: var(--teal); }
  .switch.on .switch-knob { left: 20px; }

  .search-bar { display: flex; gap: 8px; padding: 20px 20px 0; }

  .search-bar input {
    flex: 1; font-family: 'Work Sans', sans-serif; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); outline: none;
  }
  .search-bar input:focus { border-color: var(--slate); }

  .search-bar button {
    font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: 15px; padding: 12px 18px;
    border: none; border-radius: 10px; background: var(--accent-strong); color: var(--cream); cursor: pointer;
  }

  .locate-row { padding: 10px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  .locate-left { display: flex; align-items: center; gap: 14px; }

  .locate-link { font-size: 14px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

  .unit-toggle { font-size: 14px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; cursor: pointer; }

  .results { margin: 8px 20px 0; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; display: none; }
  .results.show { display: block; }
  .results button { display: block; width: 100%; text-align: left; padding: 12px 14px; background: none; border: none; border-bottom: 1px solid var(--border-faint); font-family: 'Work Sans', sans-serif; font-size: 15px; color: var(--text); cursor: pointer; }
  .results button:last-child { border-bottom: none; }
  .results button:hover { background: var(--surface-alt); }

  /* Sticky day picker */
  #dayPickerWrap {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--bg);
    padding-top: 10px;
    box-shadow: 0 4px 10px -6px rgba(28,37,65,0.18);
  }

  .day-picker { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; }
  .day-picker::-webkit-scrollbar { display: none; }

  .day-chip {
    flex: 0 0 auto; font-family: 'Work Sans', sans-serif; font-size: 13.5px; padding: 8px 14px;
    border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .day-chip.selected { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--cream); }
  .day-chip.is-today:not(.selected) { border-color: var(--teal); color: var(--teal); font-weight: 500; }

  /* Hero */
  .hero { margin: 14px 20px 0; border-radius: 20px; color: var(--cream); padding: 26px 18px 24px; text-align: center; transition: background 0.5s ease; }

  .hero-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }

  .hero-arrow {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(245,243,238,0.35);
    background: rgba(245,243,238,0.08); color: var(--cream); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .hero-arrow:disabled { opacity: 0.25; cursor: default; }

  .hero-glyph { width: 46px; height: 46px; margin: 0 auto 2px; }
  .hero-location { font-size: 15px; opacity: 0.85; margin: 0 0 2px; }
  .hero-date-tag { font-size: 12px; opacity: 0.65; margin: 0 0 4px; }

  .hero-temp { font-family: 'Fraunces', serif; font-weight: 500; font-size: 68px; line-height: 1; margin: 2px 0 0; letter-spacing: -0.02em; }
  .hero-condition { font-size: 16px; margin: 4px 0 0; }
  .hero-meta { margin-top: 14px; display: flex; justify-content: center; gap: 22px; font-size: 13px; opacity: 0.85; }

  .panel { margin: 20px 20px 0; background: var(--surface); border-radius: 16px; padding: 18px 20px; border: 1.5px solid var(--border-soft); }
  .panel-title { font-size: 14px; color: var(--text-muted); margin: 0 0 14px; }
  .panel-title .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .cond-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cond-item .label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .cond-item .value { font-size: 20px; font-weight: 500; display: flex; align-items: baseline; gap: 6px; }
  .cond-item .value .unit { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .trend-arrow { font-size: 15px; }
  .trend-rising { color: var(--teal); }
  .trend-falling { color: #C4633F; }
  .trend-steady { color: var(--text-muted); }

  .sunmoon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .sunmoon-col { display: flex; align-items: center; gap: 12px; }
  .sunmoon-col svg { width: 30px; height: 30px; flex: 0 0 auto; }
  .sunmoon-col .lines .t1 { font-size: 15px; font-weight: 500; }
  .sunmoon-col .lines .t2 { font-size: 12.5px; color: var(--text-muted); }
  .moon-name { font-size: 13px; color: var(--text-muted); margin-top: 12px; text-align: center; }

  .timeline-track { position: relative; height: 16px; border-radius: 8px; margin: 4px 2px 6px; background: var(--track-bg); overflow: hidden; }
  .tl-block { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .tl-major { background: var(--teal); }
  .tl-minor { background: #A9CFC8; }
  .tl-now { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
  .tl-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin: 0 2px; }

  .solunar-legend { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .solunar-list { margin-top: 10px; font-size: 13.5px; color: var(--text); line-height: 1.7; }
  .solunar-list .kind { color: var(--text-muted); }

  .section-label { font-size: 14px; color: var(--text-muted); margin: 26px 20px 10px; display: flex; justify-content: space-between; align-items: baseline; }

  .hourly-strip { display: flex; gap: 18px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
  .hourly-strip::-webkit-scrollbar { display: none; }
  .hour-item { flex: 0 0 auto; text-align: center; min-width: 42px; }
  .hour-item.is-now .time { color: var(--teal); font-weight: 600; }
  .hour-item .time { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .hour-item svg { width: 22px; height: 22px; margin-bottom: 8px; }
  .hour-item .temp { font-size: 15px; font-weight: 500; }

  .daily-list { margin: 6px 20px 0; }
  .daily-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-soft); gap: 12px; cursor: pointer; }
  .daily-row:last-child { border-bottom: none; }
  .daily-row .day { width: 84px; font-size: 15px; }
  .daily-row svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .daily-row .cond { flex: 1; font-size: 14px; color: var(--text-muted); }
  .daily-row .range { font-size: 15px; text-align: right; white-space: nowrap; }
  .daily-row .range .lo { color: var(--text-muted); }

  /* Compare table */
  .compare-wrap { display: flex; margin: 6px 20px 0; background: var(--surface); border-radius: 16px; border: 1.5px solid var(--border-soft); overflow: hidden; }
  .compare-labels { flex: 0 0 auto; width: 92px; border-right: 1.5px solid var(--border-soft); }
  .compare-scroll { flex: 1; overflow-x: auto; scrollbar-width: none; }
  .compare-scroll::-webkit-scrollbar { display: none; }
  .compare-cols { display: flex; }

  .compare-row-label {
    height: 40px; display: flex; align-items: center; padding: 0 10px; font-size: 11.5px; color: var(--text-muted);
    border-bottom: 1px solid var(--border-faint2);
  }
  .compare-row-label:first-child { font-size: 11px; color: var(--text-muted); }
  .compare-row-label:last-child { border-bottom: none; }

  .compare-col { flex: 0 0 66px; border-right: 1px solid var(--border-faint2); cursor: pointer; }
  .compare-col:last-child { border-right: none; }
  .compare-col.selected { background: var(--surface-alt); }
  .compare-col.is-today { background: var(--today-tint); }
  .compare-col.selected.is-today { background: var(--today-tint-selected); }

  .compare-cell {
    height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text); border-bottom: 1px solid var(--border-faint2); text-align: center; line-height: 1.25; gap: 2px;
  }
  .compare-cell:last-child { border-bottom: none; }
  .compare-cell svg { width: 16px; height: 16px; }
  .compare-cell.date-cell { font-weight: 500; font-size: 12px; }
  .compare-cell .sub { font-size: 10px; color: var(--text-muted); }

  /* Trend chart */
  .trend-panel { position: relative; }
  .trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
  .trend-header .panel-title { margin: 0; }
  .trend-toggle { display: flex; gap: 3px; background: var(--surface-alt2); border-radius: 20px; padding: 3px; flex: 0 0 auto; }
  .trend-toggle button {
    font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 5px 11px;
    border: none; border-radius: 16px; background: none; color: var(--text-muted); cursor: pointer;
  }
  .trend-toggle button.active { background: var(--accent-strong); color: var(--cream); }
  .trend-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trend-dot { cursor: pointer; }
  .trend-caption { font-size: 12.5px; color: var(--text-muted); margin: 10px 0 0; text-align: center; }

  /* Sun, moon & bite chart */
  .sunmoon-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; margin-top: 14px; }
  .sunmoon-chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; cursor: crosshair; }
  .sunmoon-chart-wrap svg { display: block; }

  .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; margin-left: 6px; border-radius: 50%; border: none;
    background: var(--surface-alt2); color: var(--text-muted); font-size: 11px; font-weight: 700;
    font-style: italic; font-family: Georgia, serif; cursor: pointer; vertical-align: middle; padding: 0;
  }
  .info-btn:hover { background: var(--surface-alt2-hover); }

  .sunmoon-info-popup {
    position: absolute; top: 46px; right: 20px; left: 20px; z-index: 20;
    background: var(--surface); border: 1px solid var(--border-faint); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(28,37,65,0.15);
    padding: 16px 18px; font-size: 12.5px; color: var(--text); line-height: 1.55;
  }
  .sunmoon-info-popup[hidden] { display: none; }
  .sunmoon-info-popup p { margin: 0 0 8px; }
  .sunmoon-info-popup p:last-child { margin-bottom: 0; }
  .info-popup-close {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    border: none; background: none; color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer;
  }
  .info-popup-close:hover { background: var(--surface-alt2); }

  .sunmoon-cursor-info { margin-bottom: 14px; padding: 10px 14px; background: var(--surface-alt); border-radius: 12px; border: 1px solid var(--border-faint); font-size: 12.5px; color: var(--text); }
  .cursor-time { font-weight: 600; margin-bottom: 6px; }
  .cursor-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .cursor-icon { display: flex; flex: 0 0 auto; width: 26px; height: 26px; }
  .cursor-icon svg { display: block; width: 100%; height: 100%; }
  .cursor-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin: 0 9px; background: var(--slate); }
  .cursor-row.cursor-bite-major { color: #2F7268; font-weight: 600; }
  .cursor-row.cursor-bite-major .cursor-dot { background: #4C9F94; }
  .cursor-row.cursor-bite-minor { color: #5B6A86; font-weight: 500; }
  .cursor-row.cursor-bite-minor .cursor-dot { background: #8C9BB5; }

  .status { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
  .hidden { display: none !important; }
  .note { font-size: 12.5px; color: var(--text-muted); margin-top: 12px; }
  .coverage-note { font-size: 12.5px; color: var(--text-muted); margin: 14px 20px 0; }

  @media (prefers-reduced-motion: reduce) { .hero { transition: none; } }
</style>
</head>
<body>

<div class="app">

  <div class="app-header">
    <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/><circle cx="15" cy="7" r="2.2" fill="var(--surface)"/>
        <line x1="4" y1="12" x2="20" y2="12"/><circle cx="9" cy="12" r="2.2" fill="var(--surface)"/>
        <line x1="4" y1="17" x2="20" y2="17"/><circle cx="17" cy="17" r="2.2" fill="var(--surface)"/>
      </svg>
    </button>
    <div class="settings-popup" id="settingsPopup" hidden>
      <button type="button" class="info-popup-close" id="settingsCloseBtn" aria-label="Close">&times;</button>
      <p class="settings-title">Settings</p>
      <div class="settings-row">
        <span>Dark mode</span>
        <button type="button" class="switch" id="darkModeSwitch" role="switch" aria-checked="false"><span class="switch-knob"></span></button>
      </div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="cityInput" placeholder="Search a coastal spot" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="locate-row">
    <div class="locate-left">
      <button class="locate-link" id="locateBtn">Use my location</button>
      <button class="locate-link" id="forgetBtn" style="display:none;">Forget saved spot</button>
    </div>
    <button class="unit-toggle" id="unitToggle">°C</button>
  </div>

  <div class="results" id="results"></div>

  <div id="dayPickerWrap"></div>
  <div id="content">
    <div class="status" id="status">Search a spot or use your location to see fishing conditions — past week through the next two.</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const locateBtn = document.getElementById('locateBtn');
  const forgetBtn = document.getElementById('forgetBtn');
  const unitToggle = document.getElementById('unitToggle');
  const resultsEl = document.getElementById('results');
  const contentEl = document.getElementById('content');
  const dayPickerWrap = document.getElementById('dayPickerWrap');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPopup = document.getElementById('settingsPopup');
  const settingsCloseBtn = document.getElementById('settingsCloseBtn');
  const darkModeSwitch = document.getElementById('darkModeSwitch');

  const SAVED_LOCATION_KEY = 'tideAndTime.savedLocation';

  function getSavedLocation() {
    try {
      const parsed = JSON.parse(localStorage.getItem(SAVED_LOCATION_KEY));
      if (parsed && typeof parsed.lat === 'number' && typeof parsed.lon === 'number') return parsed;
    } catch (e) {}
    return null;
  }

  function saveLocation(loc) {
    try { localStorage.setItem(SAVED_LOCATION_KEY, JSON.stringify(loc)); } catch (e) {}
    updateForgetBtn();
  }

  function clearSavedLocation() {
    try { localStorage.removeItem(SAVED_LOCATION_KEY); } catch (e) {}
    updateForgetBtn();
  }

  function updateForgetBtn() {
    forgetBtn.style.display = getSavedLocation() ? '' : 'none';
  }

  // ---- Settings: dark mode ----
  const DARK_MODE_KEY = 'tideAndTime.darkMode';

  function getSavedDarkMode() {
    try {
      const raw = localStorage.getItem(DARK_MODE_KEY);
      if (raw === 'true') return true;
      if (raw === 'false') return false;
    } catch (e) {}
    return null; // no explicit preference saved yet
  }

  const savedDarkPref = getSavedDarkMode();
  let darkMode = savedDarkPref === null ? true : savedDarkPref; // dark by default until the user picks otherwise

  function applyDarkMode() {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    if (darkModeSwitch) {
      darkModeSwitch.classList.toggle('on', darkMode);
      darkModeSwitch.setAttribute('aria-checked', String(darkMode));
    }
  }

  function setDarkMode(value) {
    darkMode = value;
    try { localStorage.setItem(DARK_MODE_KEY, String(darkMode)); } catch (e) {}
    applyDarkMode();
    // Chart SVGs bake their text/line colors in as JS-generated hex strings (not CSS), so they
    // need a fresh render to pick up the new theme rather than just a CSS variable flip.
    if (weatherData && selectedDateStr) renderForDate(selectedDateStr);
  }

  applyDarkMode();

  settingsBtn.addEventListener('click', () => {
    settingsPopup.hidden = !settingsPopup.hidden;
  });
  settingsCloseBtn.addEventListener('click', () => { settingsPopup.hidden = true; });
  darkModeSwitch.addEventListener('click', () => setDarkMode(!darkMode));
  document.addEventListener('click', (e) => {
    if (!settingsPopup.hidden && !e.target.closest('.app-header')) settingsPopup.hidden = true;
  });

  // Center an element within its own horizontally-scrolling container without
  // touching the page's vertical scroll (unlike scrollIntoView, which can drag
  // the whole page down to bring an off-screen ancestor into view).
  function centerHorizontally(container, el, smooth) {
    if (!container || !el) return;
    const target = el.offsetLeft - (container.clientWidth - el.offsetWidth) / 2;
    const left = Math.max(0, target);
    if (smooth) container.scrollTo({ left, behavior: 'smooth' });
    else container.scrollLeft = left;
  }

  forgetBtn.addEventListener('click', () => {
    clearSavedLocation();
    lastCoords = null;
    weatherData = null;
    marineData = null;
    cityInput.value = '';
    showStatus('Search a spot or use your location to see fishing conditions — past week through the next two.');
  });

  // Delegated so these keep working across every re-render of the sun/moon chart, not just the first.
  contentEl.addEventListener('click', (e) => {
    const infoPopup = document.getElementById('sunMoonInfoPopup');
    if (e.target.closest('#sunMoonInfoBtn')) {
      if (infoPopup) infoPopup.hidden = !infoPopup.hidden;
      return;
    }
    if (e.target.closest('#sunMoonInfoCloseBtn')) {
      if (infoPopup) infoPopup.hidden = true;
      return;
    }
    if (infoPopup && !infoPopup.hidden && !e.target.closest('#sunMoonInfoPopup')) {
      infoPopup.hidden = true;
    }
    if (e.target.closest('#sunMoonChartWrap')) handleSunMoonChartClick(e);
  });
  contentEl.addEventListener('pointerdown', handleSunMoonPointerDown);
  contentEl.addEventListener('pointermove', handleSunMoonPointerMove);
  contentEl.addEventListener('pointerup', handleSunMoonPointerUp);
  contentEl.addEventListener('pointercancel', handleSunMoonPointerUp);

  let unit = 'celsius';
  let lastCoords = null;
  let weatherData = null;
  let marineData = null;
  let todayStr = null;
  let selectedDateStr = null;
  let trendRange = '1'; // '1' | '3' | '7'
  let sunMoonRange = '1'; // '1' | '3' | '7'
  let sunMoonCursorTime = null; // Date the user clicked/dragged on the sun/moon chart, or null to track "now"
  let sunMoonChartMeta = null; // { wStartMs, wEndMs, pph } from the most recent chart build, for pointer -> time math
  let draggingSunMoonCursor = false;
  let sunMoonLastClientX = 0;
  let sunMoonAutoScrollDir = 0; // -1 (left), 0 (none), 1 (right)
  let sunMoonAutoScrollSpeed = 0;
  let sunMoonAutoScrollRAF = null;

  // ---- Weather code -> description + glyph ----
  function describeCode(code) {
    if (code === 0) return { text: 'Clear sky', kind: 'sun' };
    if ([1, 2].includes(code)) return { text: 'Partly cloudy', kind: 'cloud-sun' };
    if (code === 3) return { text: 'Overcast', kind: 'cloud' };
    if ([45, 48].includes(code)) return { text: 'Foggy', kind: 'fog' };
    if ([51, 53, 55, 56, 57].includes(code)) return { text: 'Drizzle', kind: 'rain' };
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: 'Rain', kind: 'rain' };
    if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: 'Snow', kind: 'snow' };
    if ([95, 96, 99].includes(code)) return { text: 'Thunderstorm', kind: 'storm' };
    return { text: 'Unknown', kind: 'cloud' };
  }

  function glyphFor(kind, color) {
    const c = color || 'currentColor';
    switch (kind) {
      case 'sun': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/></svg>`;
      case 'cloud-sun': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="8" cy="9" r="3.2"/><path d="M8 2.5v2M13.5 4.5l-1.4 1.4M2.5 9h2" stroke-linecap="round"/><path d="M6 20h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 20Z"/></svg>`;
      case 'cloud': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 18h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 18Z"/></svg>`;
      case 'rain': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 14h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 14Z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3" stroke-linecap="round"/></svg>`;
      case 'snow': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 13h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 13Z"/><path d="M9 18v4M9 19l-1.5 1M9 19l1.5 1M15 18v4M15 19l-1.5 1M15 19l1.5 1" stroke-linecap="round"/></svg>`;
      case 'storm': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 12h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 12Z"/><path d="M13 15l-3 5h3l-2 4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      case 'fog': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M4 9h13M4 13h16M4 17h11" stroke-linecap="round"/></svg>`;
      default: return '';
    }
  }

  function sunGlyph(color) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6"><circle cx="12" cy="14" r="4.5"/><path d="M12 2v2.5M4 14H2M22 14h-2M5.6 6.6l1.6 1.6M18.4 6.6l-1.6 1.6M4 20h16" stroke-linecap="round"/></svg>`;
  }

  function moonPhaseGlyph(phase, color, shadow, size) {
    const r = (size || 30) / 2 - 2, c = (size || 30) / 2;
    const angle = phase * 2 * Math.PI;
    const rx = Math.abs(Math.cos(angle)) * r;
    const waxing = phase < 0.5;
    const sweep1 = waxing ? 1 : 0;
    const sweep2 = waxing ? 0 : 1;
    return `<svg viewBox="0 0 ${size || 30} ${size || 30}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="${shadow}"/>
      <path d="M ${c} ${c - r} A ${rx} ${r} 0 0 ${sweep1} ${c} ${c + r} A ${r} ${r} 0 0 ${sweep2} ${c} ${c - r} Z" fill="${color}"/>
    </svg>`;
  }

  function moonPhaseName(phase) {
    if (phase < 0.03 || phase > 0.97) return 'New Moon';
    if (phase < 0.22) return 'Waxing Crescent';
    if (phase < 0.28) return 'First Quarter';
    if (phase < 0.47) return 'Waxing Gibbous';
    if (phase < 0.53) return 'Full Moon';
    if (phase < 0.72) return 'Waning Gibbous';
    if (phase < 0.78) return 'Last Quarter';
    return 'Waning Crescent';
  }

  function heroColorsFor(kind) {
    if (kind === 'sun' || kind === 'cloud-sun') return { bg: '#3A3054', accent: '#E3A857' };
    if (kind === 'rain' || kind === 'storm') return { bg: '#1C2541', accent: '#4C9F94' };
    if (kind === 'snow') return { bg: '#2B3A55', accent: '#F5F3EE' };
    return { bg: '#1C2541', accent: '#6B7A99' };
  }

  function fmtTemp(c) {
    if (c === null || c === undefined || isNaN(c)) return '--';
    const v = unit === 'celsius' ? c : (c * 9 / 5 + 32);
    return Math.round(v) + '°';
  }

  function clockLabel(d) {
    if (!d) return '--';
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m.toString().padStart(2, '0')} ${ampm}`;
  }

  function shortClock(d) {
    if (!d) return '--';
    let h = d.getHours(), m = d.getMinutes();
    const ap = h >= 12 ? 'p' : 'a';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m.toString().padStart(2, '0')}${ap}`;
  }

  // Same as shortClock but spells out am/pm — used on the sun/moon chart, where "9:15a" read
  // ambiguously next to the chart's other labels.
  function shortClockWords(d) {
    if (!d) return '--';
    let h = d.getHours(), m = d.getMinutes();
    const ap = h >= 12 ? 'pm' : 'am';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m.toString().padStart(2, '0')}${ap}`;
  }

  function minutesOfDay(d) { return d.getHours() * 60 + d.getMinutes(); }

  function fmtDateStr(d) {
    const y = d.getFullYear(), m = (d.getMonth() + 1).toString().padStart(2, '0'), day = d.getDate().toString().padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function chipLabel(dateStr, todayS) {
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(todayS + 'T00:00:00');
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Tomorrow';
    if (diffDays === -1) return 'Yesterday';
    return d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
  }

  // ---- Geocoding search ----
  async function searchCity(query) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    return data.results || [];
  }

  searchBtn.addEventListener('click', doSearch);
  cityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const q = cityInput.value.trim();
    if (!q) return;
    resultsEl.innerHTML = '<button disabled>Searching…</button>';
    resultsEl.classList.add('show');
    try {
      const matches = await searchCity(q);
      if (matches.length === 0) { resultsEl.innerHTML = '<button disabled>No matches found</button>'; return; }
      resultsEl.innerHTML = '';
      matches.forEach(m => {
        const label = [m.name, m.admin1, m.country].filter(Boolean).join(', ');
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          resultsEl.classList.remove('show');
          cityInput.value = m.name;
          loadLocation(m.latitude, m.longitude, m.name);
        });
        resultsEl.appendChild(btn);
      });
    } catch (err) {
      resultsEl.innerHTML = '<button disabled>Something went wrong. Try again.</button>';
    }
  }

  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) { showStatus("Your browser doesn't support location. Try searching instead."); return; }
    showStatus('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos) => loadLocation(pos.coords.latitude, pos.coords.longitude, 'Your location'),
      () => showStatus("Couldn't get your location. Try searching for a spot instead.")
    );
  });

  unitToggle.addEventListener('click', () => {
    unit = unit === 'celsius' ? 'fahrenheit' : 'celsius';
    unitToggle.textContent = unit === 'celsius' ? '°C' : '°F';
    if (weatherData) renderForDate(selectedDateStr);
  });

  function showStatus(msg) {
    dayPickerWrap.innerHTML = '';
    dayPickerWrap.style.boxShadow = 'none';
    contentEl.innerHTML = `<div class="status">${msg}</div>`;
  }

  function computeSolunar(lat, lon, dayStart) {
    const samples = [];
    for (let m = -360; m <= 24 * 60 + 360; m += 5) {
      const t = new Date(dayStart.getTime() + m * 60000);
      const pos = SunCalc.getMoonPosition(t, lat, lon);
      samples.push({ t, alt: pos.altitude });
    }
    const dayEnd = new Date(dayStart.getTime() + 24 * 3600 * 1000);
    const majors = [];
    for (let i = 1; i < samples.length - 1; i++) {
      const { t, alt } = samples[i];
      if (t < dayStart || t > dayEnd) continue;
      const isMax = alt > samples[i - 1].alt && alt > samples[i + 1].alt;
      const isMin = alt < samples[i - 1].alt && alt < samples[i + 1].alt;
      if (isMax || isMin) majors.push({ center: t });
    }
    const moonTimes = SunCalc.getMoonTimes(dayStart, lat, lon);
    const minors = [];
    if (moonTimes.rise) minors.push({ center: moonTimes.rise, label: 'moonrise' });
    if (moonTimes.set) minors.push({ center: moonTimes.set, label: 'moonset' });
    return { majors, minors };
  }

  async function loadLocation(lat, lon, name) {
    lastCoords = { lat, lon, name };
    showStatus('Loading conditions…');

    const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure` +
      `&hourly=temperature_2m,weather_code,surface_pressure,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset` +
      `&past_days=7&forecast_days=16&temperature_unit=celsius&timezone=auto`;

    const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}` +
      `&hourly=wave_height,sea_surface_temperature&past_days=5&forecast_days=8&timezone=auto`;

    try {
      const [forecastRes, marineRes] = await Promise.all([fetch(forecastUrl), fetch(marineUrl).catch(() => null)]);
      if (!forecastRes.ok) throw new Error('forecast failed');
      weatherData = await forecastRes.json();
      marineData = null;
      if (marineRes && marineRes.ok) { try { marineData = await marineRes.json(); } catch (e) { marineData = null; } }
      todayStr = weatherData.current.time.split('T')[0];
      selectedDateStr = todayStr;
      saveLocation({ lat, lon, name });
      buildDayPicker();
      renderForDate(selectedDateStr);
    } catch (err) {
      showStatus("Couldn't load conditions. Check your connection and try again.");
    }
  }

  function buildDayPicker() {
    const dates = weatherData.daily.time;
    const chips = dates.map(d => {
      const isToday = d === todayStr;
      return `<button class="day-chip ${d === selectedDateStr ? 'selected' : ''} ${isToday ? 'is-today' : ''}" data-date="${d}">${chipLabel(d, todayStr)}</button>`;
    }).join('');
    dayPickerWrap.innerHTML = `<div class="day-picker" id="dayPicker">${chips}</div>`;
    document.querySelectorAll('.day-chip').forEach(btn => {
      btn.addEventListener('click', () => selectDate(btn.dataset.date, true));
    });
  }

  function selectDate(dateStr, scrollChipIntoView) {
    selectedDateStr = dateStr;
    document.querySelectorAll('.day-chip').forEach(b => b.classList.toggle('selected', b.dataset.date === dateStr));
    renderForDate(dateStr);
    if (scrollChipIntoView) {
      const chip = document.querySelector(`.day-chip[data-date="${dateStr}"]`);
      centerHorizontally(document.getElementById('dayPicker'), chip, true);
    }
  }

  function shiftDate(delta) {
    const cur = new Date(selectedDateStr + 'T00:00:00');
    cur.setDate(cur.getDate() + delta);
    const newStr = fmtDateStr(cur);
    if (weatherData.daily.time.includes(newStr)) selectDate(newStr, true);
  }

  function findIndexForDateHour(times, dateStr, hh) {
    const exact = `${dateStr}T${hh}`;
    let idx = times.indexOf(exact);
    if (idx !== -1) return idx;
    let best = -1, bestDiff = Infinity;
    const target = new Date(exact);
    times.forEach((t, i) => {
      if (!t.startsWith(dateStr)) return;
      const diff = Math.abs(new Date(t) - target);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    });
    return best;
  }

  // ---- Compute a compact metrics summary for any date (shared by hero panels + compare table) ----
  function computeDayMetrics(dateStr) {
    const isToday = dateStr === todayStr;
    const hourlyTimes = weatherData.hourly.time;

    let repIdx;
    if (isToday) {
      repIdx = hourlyTimes.findIndex(t => t >= weatherData.current.time);
      if (repIdx === -1) repIdx = hourlyTimes.length - 1;
    } else {
      repIdx = findIndexForDateHour(hourlyTimes, dateStr, '12:00');
    }
    if (repIdx === -1) return null;

    const repCode = weatherData.hourly.weather_code[repIdx];
    const repTemp = isToday ? weatherData.current.temperature_2m : weatherData.hourly.temperature_2m[repIdx];
    const desc = describeCode(repCode);

    const pressureNow = isToday ? weatherData.current.surface_pressure : weatherData.hourly.surface_pressure[repIdx];
    const prevDayIdx = repIdx - 24;
    const pressurePrev = prevDayIdx >= 0 ? weatherData.hourly.surface_pressure[prevDayIdx] : null;
    let trend = { label: 'No prior data', cls: 'trend-steady', arrow: '—' };
    if (pressurePrev !== null && pressurePrev !== undefined && pressureNow !== null && pressureNow !== undefined) {
      const diff = pressureNow - pressurePrev;
      if (diff <= -1.5) trend = { label: 'Falling (24h)', cls: 'trend-falling', arrow: '↓' };
      else if (diff >= 1.5) trend = { label: 'Rising (24h)', cls: 'trend-rising', arrow: '↑' };
      else trend = { label: 'Steady (24h)', cls: 'trend-steady', arrow: '→' };
    }

    const windAt = isToday ? weatherData.current.wind_speed_10m : (weatherData.hourly.wind_speed_10m ? weatherData.hourly.wind_speed_10m[repIdx] : null);

    let waterTemp = null, waveHeight = null, marineAvailable = false;
    if (marineData && marineData.hourly) {
      const mTimes = marineData.hourly.time;
      const targetHH = isToday ? (mTimes.find(t => t >= weatherData.current.time) || `${dateStr}T12:00`).split('T')[1] : '12:00';
      const mIdx = findIndexForDateHour(mTimes, dateStr, targetHH);
      if (mIdx !== -1) {
        marineAvailable = true;
        waterTemp = marineData.hourly.sea_surface_temperature ? marineData.hourly.sea_surface_temperature[mIdx] : null;
        waveHeight = marineData.hourly.wave_height ? marineData.hourly.wave_height[mIdx] : null;
      }
    }

    const dailyIdx = weatherData.daily.time.indexOf(dateStr);
    const sunrise = dailyIdx !== -1 ? new Date(weatherData.daily.sunrise[dailyIdx]) : null;
    const sunset = dailyIdx !== -1 ? new Date(weatherData.daily.sunset[dailyIdx]) : null;
    const hi = dailyIdx !== -1 ? weatherData.daily.temperature_2m_max[dailyIdx] : null;
    const lo = dailyIdx !== -1 ? weatherData.daily.temperature_2m_min[dailyIdx] : null;

    const illum = SunCalc.getMoonIllumination(new Date(dateStr + 'T12:00:00'));
    const moonTimesToday = SunCalc.getMoonTimes(new Date(dateStr + 'T00:00:00'), lastCoords.lat, lastCoords.lon);
    const dayStart = new Date(dateStr + 'T00:00:00');
    const solunar = computeSolunar(lastCoords.lat, lastCoords.lon, dayStart);

    return { isToday, repIdx, repTemp, desc, pressureNow, trend, windAt, waterTemp, waveHeight, marineAvailable, sunrise, sunset, hi, lo, illum, moonTimesToday, solunar, dayStart, dailyIdx };
  }

  // ---- Temperature trend chart (1 day / 3 day / week) ----
  function toDisplayTemp(c) {
    if (c === null || c === undefined || isNaN(c)) return null;
    return unit === 'celsius' ? c : (c * 9 / 5 + 32);
  }

  function trendWindowDates(span) {
    const allDates = weatherData.daily.time;
    const idx = Math.max(0, allDates.indexOf(selectedDateStr));
    const before = Math.floor((span - 1) / 2);
    const after = span - 1 - before;
    let start = idx - before, end = idx + after;
    if (start < 0) { end += -start; start = 0; }
    if (end > allDates.length - 1) { start -= (end - (allDates.length - 1)); end = allDates.length - 1; }
    start = Math.max(0, start);
    end = Math.min(allDates.length - 1, end);
    return allDates.slice(start, end + 1);
  }

  function trendCaption(range) {
    if (range === '1') return 'Hourly temperature for the selected day.';
    if (range === '3') return 'Hourly temperature across 3 days, centered on the selected day.';
    return 'Daily high/low range across the week, centered on the selected day.';
  }

  // Chart SVGs are generated as raw hex strings in JS, so they can't pick up CSS variables —
  // these are the handful of colors that genuinely need to flip in dark mode (navy text/lines
  // have poor contrast on a dark panel; white dot outlines need a dark one instead). Saturated
  // data colors (gold/teal/slate-blue accents) read fine unchanged in both themes.
  function chartTheme() {
    return darkMode
      ? { text: '#E9ECF5', divider: '#333F5C', faintDivider: '#2A3350', dotStroke: '#1B2136', horizon: '#4A5878' }
      : { text: '#1C2541', divider: '#DDD8CC', faintDivider: '#EEEAE0', dotStroke: '#fff', horizon: '#C9C2AE' };
  }

  function buildTrendSVG(range) {
    const CT = chartTheme();
    const W = 400, H = 190;
    const padL = 8, padR = 8, plotTop = 14, plotH = 108, axisY = plotTop + plotH + 22;
    const plotW = W - padL - padR;
    const xScale = (t, wStart, wEnd) => {
      const span = wEnd - wStart;
      return padL + (span > 0 ? (t - wStart) / span : 0.5) * plotW;
    };

    if (range === '7') {
      const days = trendWindowDates(7);
      const hi = days.map(d => toDisplayTemp(weatherData.daily.temperature_2m_max[weatherData.daily.time.indexOf(d)]));
      const lo = days.map(d => toDisplayTemp(weatherData.daily.temperature_2m_min[weatherData.daily.time.indexOf(d)]));
      const wStart = new Date(days[0] + 'T00:00:00').getTime();
      const wEnd = new Date(days[days.length - 1] + 'T23:59:59').getTime();
      const xs = days.map(d => xScale(new Date(d + 'T12:00:00').getTime(), wStart, wEnd));
      const allVals = hi.concat(lo).filter(v => v !== null);
      if (allVals.length === 0) return '<div class="status" style="padding:30px 0;">No data available.</div>';
      let minV = Math.min(...allVals), maxV = Math.max(...allVals);
      if (minV === maxV) { minV -= 1; maxV += 1; }
      const pad = (maxV - minV) * 0.15;
      minV -= pad; maxV += pad;
      const yScale = v => plotTop + (1 - (v - minV) / (maxV - minV)) * plotH;

      const hiLine = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${yScale(hi[i])}`).join(' ');
      const loLine = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${yScale(lo[i])}`).join(' ');
      const bandPts = xs.map((x, i) => `${x},${yScale(hi[i])}`).join(' ') + ' ' +
        xs.slice().reverse().map((x, i) => `${x},${yScale(lo[xs.length - 1 - i])}`).join(' ');

      const dots = xs.map((x, i) => {
        const d = days[i];
        const isSel = d === selectedDateStr;
        const dIdx = weatherData.daily.time.indexOf(d);
        return `
          <circle cx="${x}" cy="${yScale(hi[i])}" r="${isSel ? 4 : 3}" fill="#E3A857" stroke="${CT.dotStroke}" stroke-width="1" data-date="${d}" class="trend-dot"><title>${chipLabel(d, todayStr)}: High ${fmtTemp(weatherData.daily.temperature_2m_max[dIdx])}</title></circle>
          <circle cx="${x}" cy="${yScale(lo[i])}" r="${isSel ? 4 : 3}" fill="#4C9F94" stroke="${CT.dotStroke}" stroke-width="1" data-date="${d}" class="trend-dot"><title>${chipLabel(d, todayStr)}: Low ${fmtTemp(weatherData.daily.temperature_2m_min[dIdx])}</title></circle>
          ${isSel ? `<line x1="${x}" x2="${x}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="${CT.text}" stroke-width="1" stroke-dasharray="2,3" opacity="0.3"/>` : ''}
        `;
      }).join('');

      const labels = xs.map((x, i) => {
        const d = days[i], isToday = d === todayStr;
        const label = isToday ? 'Today' : new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
        return `<text x="${x}" y="${axisY}" text-anchor="middle" font-size="11" fill="${isToday ? '#4C9F94' : '#6B7A99'}" font-family="Work Sans, sans-serif" font-weight="${isToday ? '600' : '400'}">${label}</text>`;
      }).join('');

      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <polygon points="${bandPts}" fill="#4C9F94" opacity="0.12"/>
        <path d="${hiLine}" fill="none" stroke="#E3A857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${loLine}" fill="none" stroke="#4C9F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>`;
    }

    // 1-day / 3-day continuous hourly line
    const span = range === '1' ? 1 : 3;
    const days = trendWindowDates(span);
    const wStart = new Date(days[0] + 'T00:00:00').getTime();
    const wEnd = new Date(days[days.length - 1] + 'T23:59:59').getTime();
    const pts = [];
    weatherData.hourly.time.forEach((t, i) => {
      const tm = new Date(t).getTime();
      if (tm >= wStart && tm <= wEnd) pts.push({ t: tm, v: toDisplayTemp(weatherData.hourly.temperature_2m[i]) });
    });
    const vals = pts.map(p => p.v).filter(v => v !== null);
    if (vals.length === 0) return '<div class="status" style="padding:30px 0;">No data available.</div>';
    let minV = Math.min(...vals), maxV = Math.max(...vals);
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const pad = (maxV - minV) * 0.2;
    minV -= pad; maxV += pad;
    const yScale = v => plotTop + (1 - (v - minV) / (maxV - minV)) * plotH;

    const linePts = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xScale(p.t, wStart, wEnd)} ${yScale(p.v)}`).join(' ');
    const areaPts = `M ${xScale(pts[0].t, wStart, wEnd)} ${plotTop + plotH} ` +
      pts.map(p => `L ${xScale(p.t, wStart, wEnd)} ${yScale(p.v)}`).join(' ') +
      ` L ${xScale(pts[pts.length - 1].t, wStart, wEnd)} ${plotTop + plotH} Z`;

    let nowMarker = '';
    const now = new Date(weatherData.current.time).getTime();
    if (now >= wStart && now <= wEnd) {
      const x = xScale(now, wStart, wEnd);
      nowMarker = `<line x1="${x}" x2="${x}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="${CT.text}" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>`;
    }

    let ticks;
    if (range === '1') {
      ticks = [0, 6, 12, 18, 24].map(h => ({
        x: xScale(Math.min(wStart + h * 3600000, wEnd), wStart, wEnd),
        label: h === 0 || h === 24 ? '12am' : h === 12 ? '12pm' : (h < 12 ? h + 'am' : (h - 12) + 'pm'),
        isToday: false
      }));
    } else {
      ticks = days.map(d => {
        const isToday = d === todayStr;
        return {
          x: xScale(new Date(d + 'T12:00:00').getTime(), wStart, wEnd),
          label: isToday ? 'Today' : new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' }),
          isToday
        };
      });
    }
    const tickLabels = ticks.map(tk => `<text x="${tk.x}" y="${axisY}" text-anchor="middle" font-size="11" fill="${tk.isToday ? '#4C9F94' : '#6B7A99'}" font-family="Work Sans, sans-serif" font-weight="${tk.isToday ? '600' : '400'}">${tk.label}</text>`).join('');

    const dayDividers = range === '3' ? days.slice(1).map(d => {
      const x = xScale(new Date(d + 'T00:00:00').getTime(), wStart, wEnd);
      return `<line x1="${x}" x2="${x}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="${CT.divider}" stroke-width="1"/>`;
    }).join('') : '';

    const maxPt = pts.reduce((a, b) => (b.v > a.v ? b : a));
    const minPt = pts.reduce((a, b) => (b.v < a.v ? b : a));

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4C9F94" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#4C9F94" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${dayDividers}
      <path d="${areaPts}" fill="url(#trendFill)"/>
      <path d="${linePts}" fill="none" stroke="${CT.text}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${nowMarker}
      <circle cx="${xScale(maxPt.t, wStart, wEnd)}" cy="${yScale(maxPt.v)}" r="3" fill="#E3A857"/>
      <circle cx="${xScale(minPt.t, wStart, wEnd)}" cy="${yScale(minPt.v)}" r="3" fill="#6B7A99"/>
      ${tickLabels}
    </svg>`;
  }

  function renderTrendPanel() {
    const svg = buildTrendSVG(trendRange);
    return `
      <div class="panel trend-panel">
        <div class="trend-header">
          <p class="panel-title">Temperature trend</p>
          <div class="trend-toggle" id="trendToggle">
            <button data-range="1" class="${trendRange === '1' ? 'active' : ''}">1 Day</button>
            <button data-range="3" class="${trendRange === '3' ? 'active' : ''}">3 Day</button>
            <button data-range="7" class="${trendRange === '7' ? 'active' : ''}">Week</button>
          </div>
        </div>
        <div class="trend-chart">${svg}</div>
        <p class="trend-caption">${trendCaption(trendRange)}</p>
      </div>
    `;
  }

  // ---- Sun, moon & bite (solunar) trend chart ----
  // Pixels-per-hour by zoom preset. The chart itself always spans the full fetched
  // forecast (see buildSunMoonChart) — these just control how zoomed-in the view is,
  // so scrolling keeps going as far as the underlying data allows in either direction.
  function sunMoonPPH(range) { return range === '1' ? 16 : range === '3' ? 7 : 3.2; }

  function sunMoonInfoPopupHtml(range) {
    const zoomNote = range === '1' ? 'Zoomed in for hourly detail.' : range === '3' ? 'Zoomed to a multi-day view.' : 'Zoomed out for a broad overview.';
    return `
      <p><strong>${zoomNote}</strong> Scroll to explore the full forecast at any zoom level.</p>
      <p>Tap the chart to move the cursor, or press and drag the bar to scrub through time. It snaps onto major bites (teal), minor bites (slate-blue), and sunrise/sunset (gold) — the key above updates as you go.</p>
      <p>Taller teal bands are major bite windows, shorter grey-blue bands are minor ones. How vivid a band is reflects its estimated effectiveness (moon phase, distance from Earth &amp; pressure trend), which shifts day to day.</p>
    `;
  }

  // ---- Estimated bite-window "effectiveness" ----
  // A folklore-based heuristic, not a scientific prediction: solunar theory holds that bite
  // windows are stronger near new/full moon (sun-earth-moon alignment) and near lunar perigee
  // (closer moon, stronger pull). We blend that with the day's pressure trend, since falling
  // pressure is commonly associated with more active fish. Recomputed per window, so it moves
  // day to day as the moon's phase and distance change.
  function computeBiteEffectiveness(center, isMajor, trendCls) {
    const illum = SunCalc.getMoonIllumination(center);
    const phaseFactor = Math.abs(Math.cos(illum.phase * 2 * Math.PI)); // 1 at new/full, 0 at quarters
    const moonPos = SunCalc.getMoonPosition(center, lastCoords.lat, lastCoords.lon);
    const PERIGEE_KM = 356500, APOGEE_KM = 406700;
    const distFactor = Math.min(1, Math.max(0, 1 - (moonPos.distance - PERIGEE_KM) / (APOGEE_KM - PERIGEE_KM)));
    let score = phaseFactor * 0.5 + distFactor * 0.35 + (isMajor ? 0.1 : 0.03);
    if (trendCls === 'trend-falling') score += 0.12;
    else if (trendCls === 'trend-rising') score -= 0.05;
    score = Math.max(0.18, Math.min(1, score));
    return Math.round(score * 100);
  }

  // Which color (if any) the cursor should take when parked exactly on a significant event —
  // shared by the initial chart build and by updateSunMoonCursor's live drag updates, so both
  // agree on what "locked on" looks like for each event type.
  function sunMoonSnapColor(timeMs, majors, minors, sunEvents) {
    const near = list => (list || []).some(t => Math.abs(t - timeMs) < 1000);
    if (near(majors)) return '#2F7268';
    if (near(minors)) return '#5B6A86';
    if (near(sunEvents)) return '#E3A857';
    return null;
  }

  function buildSunMoonChart(range) {
    const CT = chartTheme();
    const days = weatherData.daily.time; // full fetched range: scrolling never hits an artificial edge
    const wStart = new Date(days[0] + 'T00:00:00');
    const wEnd = new Date(days[days.length - 1] + 'T23:59:59');
    const pph = sunMoonPPH(range);
    const totalHours = (wEnd - wStart) / 3600000;
    const W = Math.max(360, Math.round(totalHours * pph));
    // At the "Week" zoom, per-event time labels would overlap (too little horizontal room),
    // so that view drops the two label rows and keeps just the day-boundary row.
    const compact = range === '7';
    const plotTop = 16, plotH = 116;
    const plotBottom = plotTop + plotH;
    // Each label row needs room for its tick (rowY-9 to rowY-4) plus its text baseline (rowY+7,
    // with the glyphs themselves reaching a couple px past that) — a 22px step keeps the next
    // row's tick clear of the previous row's text instead of the two nearly touching.
    const sunRowY = plotBottom + 18;
    const moonRowY = sunRowY + 22;
    const axisY = compact ? plotBottom + 22 : moonRowY + 22;
    const H = axisY + 14;
    const zeroY = plotTop + plotH / 2;
    const altToY = deg => plotTop + (1 - (deg + 90) / 180) * plotH;
    const xForTime = t => ((t - wStart.getTime()) / 3600000) * pph;

    const MAJOR_COLOR = '#4C9F94';
    const MINOR_COLOR = '#8C9BB5';
    const SUN_COLOR = '#E3A857';
    const MOON_COLOR = '#6B7A99';

    function eventMark(x, rowY, color, text, bold) {
      return `<line x1="${x}" x2="${x}" y1="${rowY - 9}" y2="${rowY - 4}" stroke="${color}" stroke-width="${bold ? 2 : 1.5}" stroke-linecap="round"/>` +
        `<text x="${x}" y="${rowY + 7}" text-anchor="middle" font-size="9" fill="${bold ? CT.text : '#6B7A99'}" font-family="Work Sans, sans-serif" font-weight="${bold ? '600' : '400'}">${text}</text>`;
    }

    // Labels are collected per row first, then rendered left-to-right, dropping the text (but
    // keeping the tick) on any label that would land too close to the one before it — otherwise
    // "9:15am"/"10:30pm" etc. can overlap when two events fall close together in time.
    const MIN_LABEL_GAP = 36;
    function renderMarksRow(marks, rowY) {
      marks.sort((a, b) => a.x - b.x);
      let lastShownX = -Infinity, html = '';
      marks.forEach(m => {
        const showText = (m.x - lastShownX) >= MIN_LABEL_GAP;
        if (showText) lastShownX = m.x;
        html += eventMark(m.x, rowY, m.color, showText ? m.text : '', m.bold);
      });
      return html;
    }

    const sunPts = [], moonPts = [];
    const stepMs = 20 * 60000;
    for (let t = wStart.getTime(); t <= wEnd.getTime(); t += stepMs) {
      const d = new Date(t);
      const sunAlt = SunCalc.getPosition(d, lastCoords.lat, lastCoords.lon).altitude * 180 / Math.PI;
      const moonAlt = SunCalc.getMoonPosition(d, lastCoords.lat, lastCoords.lon).altitude * 180 / Math.PI;
      const x = xForTime(t);
      sunPts.push(`${x === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${altToY(sunAlt).toFixed(1)}`);
      moonPts.push(`${x === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${altToY(moonAlt).toFixed(1)}`);
    }

    let bandsHtml = '', majorTimesMs = [], minorTimesMs = [], sunEventTimesMs = [];
    const sunMarks = [], moonMarks = [];
    days.forEach(d => {
      const dayStart = new Date(d + 'T00:00:00');
      // Reuse the same daily sunrise/sunset used elsewhere in the app (Open-Meteo), rather than
      // recomputing via SunCalc, so this chart never disagrees with the Sun & moon panel above it.
      const dIdx = weatherData.daily.time.indexOf(d);
      const sunrise = dIdx !== -1 ? new Date(weatherData.daily.sunrise[dIdx]) : null;
      const sunset = dIdx !== -1 ? new Date(weatherData.daily.sunset[dIdx]) : null;
      if (sunrise) sunEventTimesMs.push(sunrise.getTime());
      if (sunset) sunEventTimesMs.push(sunset.getTime());
      if (!compact) {
        if (sunrise) sunMarks.push({ x: xForTime(sunrise.getTime()), color: SUN_COLOR, text: shortClockWords(sunrise), bold: false });
        if (sunset) sunMarks.push({ x: xForTime(sunset.getTime()), color: SUN_COLOR, text: shortClockWords(sunset), bold: false });
      }

      const sol = computeSolunar(lastCoords.lat, lastCoords.lon, dayStart);
      const dm = computeDayMetrics(d);
      const trendCls = dm ? dm.trend.cls : 'trend-steady';
      // Major bite windows: full-height band with a solid border, strongest visual weight.
      // Fill opacity is driven by the estimated effectiveness score (more vivid = stronger).
      sol.majors.forEach(mm => {
        majorTimesMs.push(mm.center.getTime());
        const cx = xForTime(mm.center.getTime());
        const halfW = pph; // 1 hour half-width -> 2h window
        const eff = computeBiteEffectiveness(mm.center, true, trendCls);
        const opacity = (0.16 + (eff / 100) * 0.34).toFixed(2);
        bandsHtml += `<rect x="${(cx - halfW).toFixed(1)}" y="${plotTop}" width="${(halfW * 2).toFixed(1)}" height="${plotH}" fill="${MAJOR_COLOR}" opacity="${opacity}" stroke="${MAJOR_COLOR}" stroke-width="1.5" stroke-opacity="0.7"><title>Major bite window: ${shortClockWords(mm.center)} (2h) — ~${eff}% estimated effectiveness</title></rect>`;
        if (!compact) moonMarks.push({ x: cx, color: MAJOR_COLOR, text: shortClockWords(mm.center), bold: true });
      });
      // Minor bite windows (moonrise/moonset): shorter, lighter band in a distinct hue from major.
      sol.minors.forEach(mm => {
        minorTimesMs.push(mm.center.getTime());
        const cx = xForTime(mm.center.getTime());
        const halfW = pph / 2;
        const bandTop = plotTop + plotH * 0.25;
        const eff = computeBiteEffectiveness(mm.center, false, trendCls);
        const opacity = (0.14 + (eff / 100) * 0.30).toFixed(2);
        bandsHtml += `<rect x="${(cx - halfW).toFixed(1)}" y="${bandTop.toFixed(1)}" width="${(halfW * 2).toFixed(1)}" height="${(plotH * 0.5).toFixed(1)}" fill="${MINOR_COLOR}" opacity="${opacity}"><title>Minor bite window: ${shortClockWords(mm.center)} (${mm.label}) — ~${eff}% estimated effectiveness</title></rect>`;
        if (!compact) moonMarks.push({ x: cx, color: MINOR_COLOR, text: shortClockWords(mm.center), bold: false });
      });
    });
    const eventMarks = renderMarksRow(sunMarks, sunRowY) + renderMarksRow(moonMarks, moonRowY);

    let dividers = '', dayLabels = '';
    days.forEach((d, i) => {
      const dayStartX = xForTime(new Date(d + 'T00:00:00').getTime());
      if (i > 0) dividers += `<line x1="${dayStartX}" x2="${dayStartX}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="${CT.divider}" stroke-width="1"/>`;
      const isToday = d === todayStr;
      const [, mo, da] = d.split('-');
      const weekday = isToday ? 'Today' : new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      const label = `${weekday} ${da}/${mo}`;
      dayLabels += `<text x="${dayStartX + 4}" y="${axisY}" text-anchor="start" font-size="11" fill="${isToday ? '#4C9F94' : '#6B7A99'}" font-family="Work Sans, sans-serif" font-weight="${isToday ? '600' : '400'}">${label}</text>`;
    });

    // Interactive cursor: defaults to "now" until the user clicks/drags the chart to pin it elsewhere.
    // It snaps onto major/minor bite peaks and sunrise/sunset (see sunMoonSnappedTimeFromClientX),
    // taking on that event's color with a glow when locked, so it's easy to find and unmistakable.
    const cursorTime = sunMoonCursorTime || new Date(weatherData.current.time);
    let cursorLine = '';
    if (cursorTime >= wStart && cursorTime <= wEnd) {
      const x = xForTime(cursorTime.getTime());
      const snapColor = sunMoonSnapColor(cursorTime.getTime(), majorTimesMs, minorTimesMs, sunEventTimesMs);
      const isSnapped = snapColor !== null;
      const cursorColor = snapColor || CT.text;
      cursorLine = `
        <circle id="sunMoonCursorGlow" cx="${x}" cy="${plotTop - 6}" r="8" fill="${cursorColor}" opacity="${isSnapped ? 0.25 : 0}"/>
        <line id="sunMoonCursorLine" x1="${x}" x2="${x}" y1="${plotTop - 6}" y2="${plotTop + plotH + 6}" stroke="${cursorColor}" stroke-width="${isSnapped ? 2.5 : 2}" stroke-linecap="round"/>
        <circle id="sunMoonCursorDot" cx="${x}" cy="${plotTop - 6}" r="${isSnapped ? 5 : 4}" fill="${cursorColor}"/>
        <rect id="sunMoonCursorHandle" x="${x - 12}" y="${plotTop - 14}" width="24" height="${plotH + 28}" fill="transparent" style="cursor:grab; touch-action:none;"/>
      `;
    }

    const horizonLine = `<line x1="0" x2="${W}" y1="${zeroY}" y2="${zeroY}" stroke="${CT.horizon}" stroke-width="1" stroke-dasharray="3,3"/>`;
    const rowDividers = compact ? '' : `<line x1="0" x2="${W}" y1="${plotBottom + 8}" y2="${plotBottom + 8}" stroke="${CT.faintDivider}" stroke-width="1"/>`;

    const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${bandsHtml}${dividers}${horizonLine}${rowDividers}
      <path d="${sunPts.join(' ')}" fill="none" stroke="${SUN_COLOR}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${moonPts.join(' ')}" fill="none" stroke="${MOON_COLOR}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${cursorLine}${eventMarks}${dayLabels}
    </svg>`;

    sunMoonChartMeta = { wStartMs: wStart.getTime(), wEndMs: wEnd.getTime(), pph, majorTimesMs, minorTimesMs, sunEventTimesMs };
    return svg;
  }

  // ---- Cursor info key: sun/moon position & bite status at a given time ----
  function biteStatusAt(time) {
    const dayStart = new Date(fmtDateStr(time) + 'T00:00:00');
    const sol = computeSolunar(lastCoords.lat, lastCoords.lon, dayStart);
    for (const mm of sol.majors) {
      if (Math.abs(time - mm.center) <= 60 * 60000) return { active: true, type: 'major', center: mm.center };
    }
    for (const mm of sol.minors) {
      if (Math.abs(time - mm.center) <= 30 * 60000) return { active: true, type: 'minor', center: mm.center };
    }
    return { active: false };
  }

  // Sun icon reflects altitude: full sun in daylight, a sun on the horizon (with a rise/set
  // chevron) through twilight, and a quiet starfield once it's well below the horizon.
  function sunStateGlyph(altitudeDeg, rising, size) {
    const s = size || 26;
    if (altitudeDeg >= 6) {
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#E3A857" stroke-width="1.6">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 1.5v2.5M12 20v2.5M2 12h2.5M19.5 12H22M5 5l1.8 1.8M17.2 17.2 19 19M5 19l1.8-1.8M17.2 6.8 19 5" stroke-linecap="round"/>
      </svg>`;
    }
    if (altitudeDeg > -6) {
      const arrow = rising
        ? '<path d="M9 4.5 12 1.5 15 4.5" stroke="#E3A857" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
        : '<path d="M9 1.5 12 4.5 15 1.5" stroke="#E3A857" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24">
        <path d="M6.5 15a5.5 5.5 0 0 1 11 0Z" fill="#E3A857"/>
        <line x1="2" y1="15" x2="22" y2="15" stroke="#6B7A99" stroke-width="1.6" stroke-linecap="round"/>
        ${arrow}
      </svg>`;
    }
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24">
      <line x1="2" y1="15" x2="22" y2="15" stroke="#6B7A99" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="8" cy="7" r="1.1" fill="#6B7A99"/><circle cx="16" cy="5" r="0.9" fill="#6B7A99"/><circle cx="13" cy="10" r="0.7" fill="#6B7A99"/>
    </svg>`;
  }

  function sunMoonCursorInfoHtml(time) {
    const sunAlt = SunCalc.getPosition(time, lastCoords.lat, lastCoords.lon).altitude * 180 / Math.PI;
    const sunAltSoon = SunCalc.getPosition(new Date(time.getTime() + 5 * 60000), lastCoords.lat, lastCoords.lon).altitude * 180 / Math.PI;
    const moonAlt = SunCalc.getMoonPosition(time, lastCoords.lat, lastCoords.lon).altitude * 180 / Math.PI;
    const illum = SunCalc.getMoonIllumination(time);
    const bite = biteStatusAt(time);

    const sunState = sunAlt > 0 ? 'above horizon' : 'below horizon';
    const moonState = moonAlt > 0 ? 'above horizon' : 'below horizon';
    const biteText = bite.active ? `${bite.type === 'major' ? 'Major' : 'Minor'} bite window (peak ${shortClockWords(bite.center)})` : 'Not a bite window';
    const biteClass = bite.active ? (bite.type === 'major' ? 'cursor-bite-major' : 'cursor-bite-minor') : '';

    return `
      <div class="cursor-time">${chipLabel(fmtDateStr(time), todayStr)} · ${clockLabel(time)}</div>
      <div class="cursor-row"><span class="cursor-icon">${sunStateGlyph(sunAlt, sunAltSoon > sunAlt)}</span>Sun ${Math.round(sunAlt)}° (${sunState})</div>
      <div class="cursor-row"><span class="cursor-icon" style="opacity:${moonAlt > 0 ? 1 : 0.4};">${moonPhaseGlyph(illum.phase, '#F5F3EE', '#1C2541', 26)}</span>Moon ${Math.round(moonAlt)}° (${moonState}) · ${moonPhaseName(illum.phase)}, ${Math.round(illum.fraction * 100)}% lit</div>
      <div class="cursor-row ${biteClass}"><span class="cursor-dot"></span>${biteText}</div>
    `;
  }

  function updateSunMoonCursor(time) {
    if (sunMoonChartMeta) {
      const clampedMs = Math.min(sunMoonChartMeta.wEndMs, Math.max(sunMoonChartMeta.wStartMs, time.getTime()));
      time = new Date(clampedMs);
    }
    sunMoonCursorTime = time;
    if (sunMoonChartMeta) {
      const x = ((time - sunMoonChartMeta.wStartMs) / 3600000) * sunMoonChartMeta.pph;
      const snapColor = sunMoonSnapColor(time.getTime(), sunMoonChartMeta.majorTimesMs, sunMoonChartMeta.minorTimesMs, sunMoonChartMeta.sunEventTimesMs);
      const isSnapped = snapColor !== null;
      const cursorColor = snapColor || chartTheme().text;
      const glow = document.getElementById('sunMoonCursorGlow');
      const line = document.getElementById('sunMoonCursorLine');
      const dot = document.getElementById('sunMoonCursorDot');
      const handle = document.getElementById('sunMoonCursorHandle');
      if (glow) { glow.setAttribute('cx', x); glow.setAttribute('fill', cursorColor); glow.setAttribute('opacity', isSnapped ? 0.25 : 0); }
      if (line) { line.setAttribute('x1', x); line.setAttribute('x2', x); line.setAttribute('stroke', cursorColor); line.setAttribute('stroke-width', isSnapped ? 2.5 : 2); }
      if (dot) { dot.setAttribute('cx', x); dot.setAttribute('fill', cursorColor); dot.setAttribute('r', isSnapped ? 5 : 4); }
      if (handle) handle.setAttribute('x', x - 12);
    }
    const infoEl = document.getElementById('sunMoonCursorInfo');
    if (infoEl) infoEl.innerHTML = sunMoonCursorInfoHtml(time);
  }

  function renderSunMoonPanel() {
    const svg = buildSunMoonChart(sunMoonRange);
    const cursorTime = sunMoonCursorTime || new Date(weatherData.current.time);
    return `
      <div class="panel trend-panel">
        <div class="trend-header">
          <p class="panel-title">Sun, moon &amp; bite times<button type="button" class="info-btn" id="sunMoonInfoBtn" aria-label="About this chart">i</button></p>
          <div class="trend-toggle" id="sunMoonToggle">
            <button data-range="1" class="${sunMoonRange === '1' ? 'active' : ''}">1 Day</button>
            <button data-range="3" class="${sunMoonRange === '3' ? 'active' : ''}">3 Day</button>
            <button data-range="7" class="${sunMoonRange === '7' ? 'active' : ''}">Week</button>
          </div>
        </div>
        <div class="sunmoon-info-popup" id="sunMoonInfoPopup" hidden>
          <button type="button" class="info-popup-close" id="sunMoonInfoCloseBtn" aria-label="Close">&times;</button>
          ${sunMoonInfoPopupHtml(sunMoonRange)}
        </div>
        <div class="sunmoon-cursor-info" id="sunMoonCursorInfo">${sunMoonCursorInfoHtml(cursorTime)}</div>
        <div class="sunmoon-chart-wrap" id="sunMoonChartWrap">${svg}</div>
        <div class="sunmoon-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#E3A857;"></span>Sun altitude</span>
          <span class="legend-item"><span class="legend-dot" style="background:#6B7A99;"></span>Moon altitude</span>
          <span class="legend-item"><span class="legend-dot" style="background:#4C9F94;"></span>Major bite (2h)</span>
          <span class="legend-item"><span class="legend-dot" style="background:#8C9BB5;"></span>Minor bite (1h)</span>
        </div>
      </div>
    `;
  }

  function scrollSunMoonToFocus() {
    const wrap = document.getElementById('sunMoonChartWrap');
    if (!wrap) return;
    const days = weatherData.daily.time;
    const wStart = new Date(days[0] + 'T00:00:00');
    const wEnd = new Date(days[days.length - 1] + 'T23:59:59');
    const pph = sunMoonPPH(sunMoonRange);
    const now = new Date(weatherData.current.time);
    const focusTime = (now >= wStart && now <= wEnd) ? now : new Date(selectedDateStr + 'T12:00:00');
    const x = ((focusTime - wStart) / 3600000) * pph;
    wrap.scrollLeft = Math.max(0, x - wrap.clientWidth / 2);
  }

  function sunMoonTimeFromClientX(clientX) {
    const wrap = document.getElementById('sunMoonChartWrap');
    const svgEl = wrap && wrap.querySelector('svg');
    if (!svgEl || !sunMoonChartMeta) return null;
    const rect = svgEl.getBoundingClientRect();
    const scale = svgEl.viewBox.baseVal.width / rect.width;
    const dataX = (clientX - rect.left) * scale;
    const ms = sunMoonChartMeta.wStartMs + (dataX / sunMoonChartMeta.pph) * 3600000;
    return new Date(ms);
  }

  // A fixed time window (not pixel-based) so the pull feels consistent at every zoom level —
  // a pixel radius would swing from under a minute at the Week zoom to nearly an hour at the
  // 1 Day zoom, since those map very different amounts of time to the same screen distance.
  // Each event type gets its own "slight" pull window, roughly scaled to how prominent that
  // event is (majors have the widest 2h band, minors and sun events are more momentary).
  const SUNMOON_SNAP_WINDOWS = [
    { key: 'majorTimesMs', ms: 10 * 60000 },
    { key: 'minorTimesMs', ms: 6 * 60000 },
    { key: 'sunEventTimesMs', ms: 6 * 60000 },
  ];

  // Pulls the cursor onto the nearest significant event — major/minor bite peak, sunrise, or
  // sunset — when it's within that event's window, so those moments are easy to land on
  // precisely without needing pixel-perfect dragging. When more than one is in range, whichever
  // is genuinely closest wins.
  function sunMoonSnapTime(rawTime) {
    if (!rawTime || !sunMoonChartMeta) return rawTime;
    const rawMs = rawTime.getTime();
    let best = null, bestDist = Infinity;
    SUNMOON_SNAP_WINDOWS.forEach(({ key, ms }) => {
      (sunMoonChartMeta[key] || []).forEach(t => {
        const dist = Math.abs(t - rawMs);
        if (dist <= ms && dist < bestDist) { bestDist = dist; best = t; }
      });
    });
    return best !== null ? new Date(best) : rawTime;
  }

  function sunMoonSnappedTimeFromClientX(clientX) {
    return sunMoonSnapTime(sunMoonTimeFromClientX(clientX));
  }

  function handleSunMoonChartClick(e) {
    if (e.target.id === 'sunMoonCursorHandle') return; // a plain tap-without-drag on the handle is a no-op here
    const time = sunMoonSnappedTimeFromClientX(e.clientX);
    if (time) updateSunMoonCursor(time);
  }

  const SUNMOON_EDGE_ZONE = 50; // px from the visible chart's edge that triggers auto-scroll
  const SUNMOON_MAX_SCROLL_SPEED = 14; // px per animation frame at the very edge

  function sunMoonAutoScrollStep() {
    const wrap = document.getElementById('sunMoonChartWrap');
    if (!wrap || !draggingSunMoonCursor || sunMoonAutoScrollDir === 0) { sunMoonAutoScrollRAF = null; return; }
    const maxScroll = wrap.scrollWidth - wrap.clientWidth;
    wrap.scrollLeft = Math.max(0, Math.min(maxScroll, wrap.scrollLeft + sunMoonAutoScrollDir * sunMoonAutoScrollSpeed));
    const time = sunMoonSnappedTimeFromClientX(sunMoonLastClientX);
    if (time) updateSunMoonCursor(time);
    sunMoonAutoScrollRAF = requestAnimationFrame(sunMoonAutoScrollStep);
  }

  function updateSunMoonAutoScroll(clientX) {
    const wrap = document.getElementById('sunMoonChartWrap');
    if (!wrap) { sunMoonAutoScrollDir = 0; return; }
    const rect = wrap.getBoundingClientRect();
    const leftDist = clientX - rect.left;
    const rightDist = rect.right - clientX;
    if (leftDist < SUNMOON_EDGE_ZONE) {
      sunMoonAutoScrollDir = -1;
      sunMoonAutoScrollSpeed = SUNMOON_MAX_SCROLL_SPEED * (1 - Math.max(0, leftDist) / SUNMOON_EDGE_ZONE);
    } else if (rightDist < SUNMOON_EDGE_ZONE) {
      sunMoonAutoScrollDir = 1;
      sunMoonAutoScrollSpeed = SUNMOON_MAX_SCROLL_SPEED * (1 - Math.max(0, rightDist) / SUNMOON_EDGE_ZONE);
    } else {
      sunMoonAutoScrollDir = 0;
    }
    if (sunMoonAutoScrollDir !== 0 && !sunMoonAutoScrollRAF) {
      sunMoonAutoScrollRAF = requestAnimationFrame(sunMoonAutoScrollStep);
    }
  }

  function stopSunMoonAutoScroll() {
    sunMoonAutoScrollDir = 0;
    if (sunMoonAutoScrollRAF) { cancelAnimationFrame(sunMoonAutoScrollRAF); sunMoonAutoScrollRAF = null; }
  }

  function handleSunMoonPointerDown(e) {
    if (e.target.id !== 'sunMoonCursorHandle') return;
    draggingSunMoonCursor = true;
    sunMoonLastClientX = e.clientX;
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
    e.target.style.cursor = 'grabbing';
    const time = sunMoonSnappedTimeFromClientX(e.clientX);
    if (time) updateSunMoonCursor(time);
    e.preventDefault();
  }

  function handleSunMoonPointerMove(e) {
    if (!draggingSunMoonCursor) return;
    sunMoonLastClientX = e.clientX;
    const time = sunMoonSnappedTimeFromClientX(e.clientX);
    if (time) updateSunMoonCursor(time);
    updateSunMoonAutoScroll(e.clientX);
  }

  function handleSunMoonPointerUp(e) {
    if (!draggingSunMoonCursor) return;
    draggingSunMoonCursor = false;
    stopSunMoonAutoScroll();
    if (e.target.id === 'sunMoonCursorHandle') e.target.style.cursor = 'grab';
  }

  function renderForDate(dateStr) {
    const m = computeDayMetrics(dateStr);
    if (!m) { contentEl.innerHTML = `<div class="status">No weather data available for this date.</div>`; return; }

    const colors = heroColorsFor(m.desc.kind);
    const hourlyTimes = weatherData.hourly.time;
    const minIdxDate = weatherData.daily.time[0];
    const maxIdxDate = weatherData.daily.time[weatherData.daily.time.length - 1];
    const canPrev = dateStr !== minIdxDate;
    const canNext = dateStr !== maxIdxDate;

    const slotHours = ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'];
    const nowHour = m.isToday ? (new Date(weatherData.current.time)).getHours().toString().padStart(2, '0') : null;
    const hourlyHtml = slotHours.map(hh => {
      const idx = findIndexForDateHour(hourlyTimes, dateStr, hh);
      if (idx === -1) return '';
      const d2 = describeCode(weatherData.hourly.weather_code[idx]);
      const t = weatherData.hourly.temperature_2m[idx];
      const isNow = m.isToday && hh.split(':')[0] === nowHour;
      const hLabel = (parseInt(hh) % 12 === 0 ? 12 : parseInt(hh) % 12) + (parseInt(hh) < 12 ? 'AM' : 'PM');
      return `<div class="hour-item ${isNow ? 'is-now' : ''}"><div class="time">${hLabel}</div>${glyphFor(d2.kind, chartTheme().text)}<div class="temp">${fmtTemp(t)}</div></div>`;
    }).join('');

    const upcoming = [];
    for (let i = 0; i < weatherData.daily.time.length; i++) {
      if (weatherData.daily.time[i] >= todayStr && upcoming.length < 7) upcoming.push(i);
    }
    const dailyHtml = upcoming.map(i => {
      const d = weatherData.daily.time[i];
      const desc2 = describeCode(weatherData.daily.weather_code[i]);
      return `<div class="daily-row" data-date="${d}"><div class="day">${chipLabel(d, todayStr)}</div>${glyphFor(desc2.kind, '#6B7A99')}<div class="cond">${desc2.text}</div><div class="range"><span>${fmtTemp(weatherData.daily.temperature_2m_max[i])}</span> <span class="lo">${fmtTemp(weatherData.daily.temperature_2m_min[i])}</span></div></div>`;
    }).join('');

    const waterTempHtml = m.marineAvailable && m.waterTemp !== null
      ? `<div class="value">${fmtTemp(m.waterTemp)}</div>`
      : `<div class="value" style="font-size:14px; color:var(--text-muted); font-weight:400;">${m.marineAvailable ? 'No data' : 'Outside forecast range'}</div>`;
    const waveHtml = m.marineAvailable && m.waveHeight !== null
      ? `<div class="value">${m.waveHeight.toFixed(1)}<span class="unit">m</span></div>`
      : `<div class="value" style="font-size:14px; color:var(--text-muted); font-weight:400;">${m.marineAvailable ? 'No data' : 'Outside forecast range'}</div>`;

    const condHtml = `
      <div class="cond-grid">
        <div class="cond-item">
          <div class="label">Pressure</div>
          <div class="value">${m.pressureNow ? Math.round(m.pressureNow) : '--'}<span class="unit">hPa</span> <span class="trend-arrow ${m.trend.cls}">${m.trend.arrow}</span></div>
          <div class="note" style="margin-top:2px;">${m.trend.label}</div>
        </div>
        <div class="cond-item">
          <div class="label">Wind</div>
          <div class="value">${m.windAt !== null && m.windAt !== undefined ? Math.round(m.windAt) : '--'}<span class="unit">km/h</span></div>
        </div>
        <div class="cond-item"><div class="label">Water temp</div>${waterTempHtml}</div>
        <div class="cond-item"><div class="label">Wave height</div>${waveHtml}</div>
      </div>
    `;

    const sunMoonHtml = `
      <div class="sunmoon-grid">
        <div class="sunmoon-col">${sunGlyph('#E3A857')}<div class="lines"><div class="t1">${m.sunrise ? clockLabel(m.sunrise) : '--'}</div><div class="t2">Sunrise</div></div></div>
        <div class="sunmoon-col">${sunGlyph('#6B7A99')}<div class="lines"><div class="t1">${m.sunset ? clockLabel(m.sunset) : '--'}</div><div class="t2">Sunset</div></div></div>
        <div class="sunmoon-col">${moonPhaseGlyph(m.illum.phase, '#F5F3EE', '#1C2541')}<div class="lines"><div class="t1">${m.moonTimesToday.rise ? clockLabel(m.moonTimesToday.rise) : '--'}</div><div class="t2">Moonrise</div></div></div>
        <div class="sunmoon-col">${moonPhaseGlyph(m.illum.phase, '#F5F3EE', '#1C2541')}<div class="lines"><div class="t1">${m.moonTimesToday.set ? clockLabel(m.moonTimesToday.set) : '--'}</div><div class="t2">Moonset</div></div></div>
      </div>
      <div class="moon-name">${moonPhaseName(m.illum.phase)} · ${Math.round(m.illum.fraction * 100)}% illuminated</div>
    `;

    const dayMinutes = 24 * 60;
    function blockStyle(center, halfWidthMin, cls) {
      let centerMin = minutesOfDay(center);
      const dayDiff = Math.round((new Date(center.getFullYear(), center.getMonth(), center.getDate()) - m.dayStart) / 86400000);
      centerMin += dayDiff * dayMinutes;
      let left = centerMin - halfWidthMin;
      const clippedLeft = Math.max(0, left);
      const clippedRight = Math.min(dayMinutes, left + halfWidthMin * 2);
      const finalWidth = clippedRight - clippedLeft;
      if (finalWidth <= 0) return '';
      return `<div class="tl-block ${cls}" style="left:${(clippedLeft / dayMinutes) * 100}%; width:${(finalWidth / dayMinutes) * 100}%;"></div>`;
    }
    let tlBlocks = '';
    m.solunar.majors.forEach(mm => { tlBlocks += blockStyle(mm.center, 60, 'tl-major'); });
    m.solunar.minors.forEach(mm => { tlBlocks += blockStyle(mm.center, 30, 'tl-minor'); });
    let nowMarker = '';
    if (m.isToday) {
      const nowDate = new Date(weatherData.current.time);
      nowMarker = `<div class="tl-now" style="left:${(minutesOfDay(nowDate) / dayMinutes) * 100}%;"></div>`;
    }
    const solunarListHtml = [
      ...m.solunar.majors.map(mm => `<div><span class="kind">Major</span> — ${clockLabel(mm.center)} (2h window)</div>`),
      ...m.solunar.minors.map(mm => `<div><span class="kind">Minor</span> — ${clockLabel(mm.center)} (${mm.label})</div>`)
    ].join('');
    const solunarHtml = `
      <div class="timeline-track">${tlBlocks}${nowMarker}</div>
      <div class="tl-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>12am</span></div>
      <div class="solunar-legend">
