<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tide &amp; Time — Fishing Conditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1C2541;
    --cream: #F5F3EE;
    --gold: #E3A857;
    --teal: #4C9F94;
    --slate: #6B7A99;
  }

  * { box-sizing: border-box; }

  body { margin: 0; font-family: 'Work Sans', sans-serif; background: var(--cream); color: var(--navy); min-height: 100vh; }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 30px; }

  .search-bar { display: flex; gap: 8px; padding: 20px 20px 0; }

  .search-bar input {
    flex: 1; font-family: 'Work Sans', sans-serif; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid #DDD8CC; border-radius: 10px; background: #fff; color: var(--navy); outline: none;
  }
  .search-bar input:focus { border-color: var(--slate); }

  .search-bar button {
    font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: 15px; padding: 12px 18px;
    border: none; border-radius: 10px; background: var(--navy); color: var(--cream); cursor: pointer;
  }

  .locate-row { padding: 10px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  .locate-left { display: flex; align-items: center; gap: 14px; }

  .locate-link { font-size: 14px; color: var(--slate); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

  .unit-toggle { font-size: 14px; color: var(--slate); background: none; border: 1px solid #DDD8CC; border-radius: 20px; padding: 4px 12px; cursor: pointer; }

  .results { margin: 8px 20px 0; background: #fff; border: 1.5px solid #DDD8CC; border-radius: 10px; overflow: hidden; display: none; }
  .results.show { display: block; }
  .results button { display: block; width: 100%; text-align: left; padding: 12px 14px; background: none; border: none; border-bottom: 1px solid #EEEAE0; font-family: 'Work Sans', sans-serif; font-size: 15px; color: var(--navy); cursor: pointer; }
  .results button:last-child { border-bottom: none; }
  .results button:hover { background: #F9F7F2; }

  /* Sticky day picker */
  #dayPickerWrap {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--cream);
    padding-top: 10px;
    box-shadow: 0 4px 10px -6px rgba(28,37,65,0.18);
  }

  .day-picker { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; }
  .day-picker::-webkit-scrollbar { display: none; }

  .day-chip {
    flex: 0 0 auto; font-family: 'Work Sans', sans-serif; font-size: 13.5px; padding: 8px 14px;
    border-radius: 20px; border: 1.5px solid #DDD8CC; background: #fff; color: var(--navy); cursor: pointer; white-space: nowrap;
  }
  .day-chip.selected { background: var(--navy); border-color: var(--navy); color: var(--cream); }
  .day-chip.is-today:not(.selected) { border-color: var(--teal); color: var(--teal); font-weight: 500; }

  /* Hero */
  .hero { margin: 14px 20px 0; border-radius: 20px; color: var(--cream); padding: 26px 18px 24px; text-align: center; transition: background 0.5s ease; }

  .hero-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }

  .hero-arrow {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(245,243,238,0.35);
    background: rgba(245,243,238,0.08); color: var(--cream); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .hero-arrow:disabled { opacity: 0.25; cursor: default; }

  .hero-glyph { width: 46px; height: 46px; margin: 0 auto 2px; }
  .hero-location { font-size: 15px; opacity: 0.85; margin: 0 0 2px; }
  .hero-date-tag { font-size: 12px; opacity: 0.65; margin: 0 0 4px; }

  .hero-temp { font-family: 'Fraunces', serif; font-weight: 500; font-size: 68px; line-height: 1; margin: 2px 0 0; letter-spacing: -0.02em; }
  .hero-condition { font-size: 16px; margin: 4px 0 0; }
  .hero-meta { margin-top: 14px; display: flex; justify-content: center; gap: 22px; font-size: 13px; opacity: 0.85; }

  .panel { margin: 20px 20px 0; background: #fff; border-radius: 16px; padding: 18px 20px; border: 1.5px solid #E8E3D6; }
  .panel-title { font-size: 14px; color: var(--slate); margin: 0 0 14px; }
  .panel-title .sub { font-size: 12px; color: var(--slate); font-weight: 400; }

  .cond-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cond-item .label { font-size: 12.5px; color: var(--slate); margin-bottom: 4px; }
  .cond-item .value { font-size: 20px; font-weight: 500; display: flex; align-items: baseline; gap: 6px; }
  .cond-item .value .unit { font-size: 13px; color: var(--slate); font-weight: 400; }
  .trend-arrow { font-size: 15px; }
  .trend-rising { color: var(--teal); }
  .trend-falling { color: #C4633F; }
  .trend-steady { color: var(--slate); }

  .sunmoon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .sunmoon-col { display: flex; align-items: center; gap: 12px; }
  .sunmoon-col svg { width: 30px; height: 30px; flex: 0 0 auto; }
  .sunmoon-col .lines .t1 { font-size: 15px; font-weight: 500; }
  .sunmoon-col .lines .t2 { font-size: 12.5px; color: var(--slate); }
  .moon-name { font-size: 13px; color: var(--slate); margin-top: 12px; text-align: center; }

  .timeline-track { position: relative; height: 16px; border-radius: 8px; margin: 4px 2px 6px; background: #DCE2EC; overflow: hidden; }
  .tl-block { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .tl-major { background: var(--teal); }
  .tl-minor { background: #A9CFC8; }
  .tl-now { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--navy); }
  .tl-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--slate); margin: 0 2px; }

  .solunar-legend { display: flex; gap: 18px; margin-top: 14px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--navy); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .solunar-list { margin-top: 10px; font-size: 13.5px; color: var(--navy); line-height: 1.7; }
  .solunar-list .kind { color: var(--slate); }

  .section-label { font-size: 14px; color: var(--slate); margin: 26px 20px 10px; display: flex; justify-content: space-between; align-items: baseline; }

  .hourly-strip { display: flex; gap: 18px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
  .hourly-strip::-webkit-scrollbar { display: none; }
  .hour-item { flex: 0 0 auto; text-align: center; min-width: 42px; }
  .hour-item.is-now .time { color: var(--teal); font-weight: 600; }
  .hour-item .time { font-size: 13px; color: var(--slate); margin-bottom: 8px; }
  .hour-item svg { width: 22px; height: 22px; margin-bottom: 8px; }
  .hour-item .temp { font-size: 15px; font-weight: 500; }

  .daily-list { margin: 6px 20px 0; }
  .daily-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #E5E1D6; gap: 12px; cursor: pointer; }
  .daily-row:last-child { border-bottom: none; }
  .daily-row .day { width: 84px; font-size: 15px; }
  .daily-row svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .daily-row .cond { flex: 1; font-size: 14px; color: var(--slate); }
  .daily-row .range { font-size: 15px; text-align: right; white-space: nowrap; }
  .daily-row .range .lo { color: var(--slate); }

  /* Compare table */
  .compare-wrap { display: flex; margin: 6px 20px 0; background: #fff; border-radius: 16px; border: 1.5px solid #E8E3D6; overflow: hidden; }
  .compare-labels { flex: 0 0 auto; width: 92px; border-right: 1.5px solid #E8E3D6; }
  .compare-scroll { flex: 1; overflow-x: auto; scrollbar-width: none; }
  .compare-scroll::-webkit-scrollbar { display: none; }
  .compare-cols { display: flex; }

  .compare-row-label {
    height: 40px; display: flex; align-items: center; padding: 0 10px; font-size: 11.5px; color: var(--slate);
    border-bottom: 1px solid #F0ECE0;
  }
  .compare-row-label:first-child { font-size: 11px; color: var(--slate); }
  .compare-row-label:last-child { border-bottom: none; }

  .compare-col { flex: 0 0 66px; border-right: 1px solid #F0ECE0; cursor: pointer; }
  .compare-col:last-child { border-right: none; }
  .compare-col.selected { background: #F5F3EE; }
  .compare-col.is-today { background: #F0F7F5; }
  .compare-col.selected.is-today { background: #E4EFEC; }

  .compare-cell {
    height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; color: var(--navy); border-bottom: 1px solid #F0ECE0; text-align: center; line-height: 1.25; gap: 2px;
  }
  .compare-cell:last-child { border-bottom: none; }
  .compare-cell svg { width: 16px; height: 16px; }
  .compare-cell.date-cell { font-weight: 500; font-size: 12px; }
  .compare-cell .sub { font-size: 10px; color: var(--slate); }

  /* Trend chart */
  .trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
  .trend-header .panel-title { margin: 0; }
  .trend-toggle { display: flex; gap: 3px; background: #F0ECE0; border-radius: 20px; padding: 3px; flex: 0 0 auto; }
  .trend-toggle button {
    font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 5px 11px;
    border: none; border-radius: 16px; background: none; color: var(--slate); cursor: pointer;
  }
  .trend-toggle button.active { background: var(--navy); color: var(--cream); }
  .trend-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trend-dot { cursor: pointer; }
  .trend-caption { font-size: 12.5px; color: var(--slate); margin: 10px 0 0; text-align: center; }

  .status { text-align: center; padding: 60px 20px; color: var(--slate); font-size: 15px; }
  .hidden { display: none !important; }
  .note { font-size: 12.5px; color: var(--slate); margin-top: 12px; }
  .coverage-note { font-size: 12.5px; color: var(--slate); margin: 14px 20px 0; }

  @media (prefers-reduced-motion: reduce) { .hero { transition: none; } }
</style>
</head>
<body>

<div class="app">

  <div class="search-bar">
    <input type="text" id="cityInput" placeholder="Search a coastal spot" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="locate-row">
    <div class="locate-left">
      <button class="locate-link" id="locateBtn">Use my location</button>
      <button class="locate-link" id="forgetBtn" style="display:none;">Forget saved spot</button>
    </div>
    <button class="unit-toggle" id="unitToggle">°C</button>
  </div>

  <div class="results" id="results"></div>

  <div id="dayPickerWrap"></div>
  <div id="content">
    <div class="status" id="status">Search a spot or use your location to see fishing conditions — past week through the next two.</div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script>
  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const locateBtn = document.getElementById('locateBtn');
  const forgetBtn = document.getElementById('forgetBtn');
  const unitToggle = document.getElementById('unitToggle');
  const resultsEl = document.getElementById('results');
  const contentEl = document.getElementById('content');
  const dayPickerWrap = document.getElementById('dayPickerWrap');

  const SAVED_LOCATION_KEY = 'tideAndTime.savedLocation';

  function getSavedLocation() {
    try {
      const parsed = JSON.parse(localStorage.getItem(SAVED_LOCATION_KEY));
      if (parsed && typeof parsed.lat === 'number' && typeof parsed.lon === 'number') return parsed;
    } catch (e) {}
    return null;
  }

  function saveLocation(loc) {
    try { localStorage.setItem(SAVED_LOCATION_KEY, JSON.stringify(loc)); } catch (e) {}
    updateForgetBtn();
  }

  function clearSavedLocation() {
    try { localStorage.removeItem(SAVED_LOCATION_KEY); } catch (e) {}
    updateForgetBtn();
  }

  function updateForgetBtn() {
    forgetBtn.style.display = getSavedLocation() ? '' : 'none';
  }

  forgetBtn.addEventListener('click', () => {
    clearSavedLocation();
    lastCoords = null;
    weatherData = null;
    marineData = null;
    cityInput.value = '';
    showStatus('Search a spot or use your location to see fishing conditions — past week through the next two.');
  });

  let unit = 'celsius';
  let lastCoords = null;
  let weatherData = null;
  let marineData = null;
  let todayStr = null;
  let selectedDateStr = null;
  let trendRange = '1'; // '1' | '3' | '7'

  // ---- Weather code -> description + glyph ----
  function describeCode(code) {
    if (code === 0) return { text: 'Clear sky', kind: 'sun' };
    if ([1, 2].includes(code)) return { text: 'Partly cloudy', kind: 'cloud-sun' };
    if (code === 3) return { text: 'Overcast', kind: 'cloud' };
    if ([45, 48].includes(code)) return { text: 'Foggy', kind: 'fog' };
    if ([51, 53, 55, 56, 57].includes(code)) return { text: 'Drizzle', kind: 'rain' };
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { text: 'Rain', kind: 'rain' };
    if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: 'Snow', kind: 'snow' };
    if ([95, 96, 99].includes(code)) return { text: 'Thunderstorm', kind: 'storm' };
    return { text: 'Unknown', kind: 'cloud' };
  }

  function glyphFor(kind, color) {
    const c = color || 'currentColor';
    switch (kind) {
      case 'sun': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke-linecap="round"/></svg>`;
      case 'cloud-sun': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="8" cy="9" r="3.2"/><path d="M8 2.5v2M13.5 4.5l-1.4 1.4M2.5 9h2" stroke-linecap="round"/><path d="M6 20h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 20Z"/></svg>`;
      case 'cloud': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 18h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 18Z"/></svg>`;
      case 'rain': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 14h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 14Z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3" stroke-linecap="round"/></svg>`;
      case 'snow': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 13h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 13Z"/><path d="M9 18v4M9 19l-1.5 1M9 19l1.5 1M15 18v4M15 19l-1.5 1M15 19l1.5 1" stroke-linecap="round"/></svg>`;
      case 'storm': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M6 12h11a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.7A3.8 3.8 0 0 0 6 12Z"/><path d="M13 15l-3 5h3l-2 4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      case 'fog': return `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.6"><path d="M4 9h13M4 13h16M4 17h11" stroke-linecap="round"/></svg>`;
      default: return '';
    }
  }

  function sunGlyph(color) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6"><circle cx="12" cy="14" r="4.5"/><path d="M12 2v2.5M4 14H2M22 14h-2M5.6 6.6l1.6 1.6M18.4 6.6l-1.6 1.6M4 20h16" stroke-linecap="round"/></svg>`;
  }

  function moonPhaseGlyph(phase, color, shadow, size) {
    const r = (size || 30) / 2 - 2, c = (size || 30) / 2;
    const angle = phase * 2 * Math.PI;
    const rx = Math.abs(Math.cos(angle)) * r;
    const waxing = phase < 0.5;
    const sweep1 = waxing ? 1 : 0;
    const sweep2 = waxing ? 0 : 1;
    return `<svg viewBox="0 0 ${size || 30} ${size || 30}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="${shadow}"/>
      <path d="M ${c} ${c - r} A ${rx} ${r} 0 0 ${sweep1} ${c} ${c + r} A ${r} ${r} 0 0 ${sweep2} ${c} ${c - r} Z" fill="${color}"/>
    </svg>`;
  }

  function moonPhaseName(phase) {
    if (phase < 0.03 || phase > 0.97) return 'New Moon';
    if (phase < 0.22) return 'Waxing Crescent';
    if (phase < 0.28) return 'First Quarter';
    if (phase < 0.47) return 'Waxing Gibbous';
    if (phase < 0.53) return 'Full Moon';
    if (phase < 0.72) return 'Waning Gibbous';
    if (phase < 0.78) return 'Last Quarter';
    return 'Waning Crescent';
  }

  function heroColorsFor(kind) {
    if (kind === 'sun' || kind === 'cloud-sun') return { bg: '#3A3054', accent: '#E3A857' };
    if (kind === 'rain' || kind === 'storm') return { bg: '#1C2541', accent: '#4C9F94' };
    if (kind === 'snow') return { bg: '#2B3A55', accent: '#F5F3EE' };
    return { bg: '#1C2541', accent: '#6B7A99' };
  }

  function fmtTemp(c) {
    if (c === null || c === undefined || isNaN(c)) return '--';
    const v = unit === 'celsius' ? c : (c * 9 / 5 + 32);
    return Math.round(v) + '°';
  }

  function clockLabel(d) {
    if (!d) return '--';
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m.toString().padStart(2, '0')} ${ampm}`;
  }

  function shortClock(d) {
    if (!d) return '--';
    let h = d.getHours(), m = d.getMinutes();
    const ap = h >= 12 ? 'p' : 'a';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m.toString().padStart(2, '0')}${ap}`;
  }

  function minutesOfDay(d) { return d.getHours() * 60 + d.getMinutes(); }

  function fmtDateStr(d) {
    const y = d.getFullYear(), m = (d.getMonth() + 1).toString().padStart(2, '0'), day = d.getDate().toString().padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function chipLabel(dateStr, todayS) {
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(todayS + 'T00:00:00');
    const diffDays = Math.round((d - today) / 86400000);
    if (diffDays === 0) return 'Today';
    if (diffDays === 1) return 'Tomorrow';
    if (diffDays === -1) return 'Yesterday';
    return d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
  }

  // ---- Geocoding search ----
  async function searchCity(query) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=6&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    return data.results || [];
  }

  searchBtn.addEventListener('click', doSearch);
  cityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const q = cityInput.value.trim();
    if (!q) return;
    resultsEl.innerHTML = '<button disabled>Searching…</button>';
    resultsEl.classList.add('show');
    try {
      const matches = await searchCity(q);
      if (matches.length === 0) { resultsEl.innerHTML = '<button disabled>No matches found</button>'; return; }
      resultsEl.innerHTML = '';
      matches.forEach(m => {
        const label = [m.name, m.admin1, m.country].filter(Boolean).join(', ');
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          resultsEl.classList.remove('show');
          cityInput.value = m.name;
          loadLocation(m.latitude, m.longitude, m.name);
        });
        resultsEl.appendChild(btn);
      });
    } catch (err) {
      resultsEl.innerHTML = '<button disabled>Something went wrong. Try again.</button>';
    }
  }

  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) { showStatus("Your browser doesn't support location. Try searching instead."); return; }
    showStatus('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      (pos) => loadLocation(pos.coords.latitude, pos.coords.longitude, 'Your location'),
      () => showStatus("Couldn't get your location. Try searching for a spot instead.")
    );
  });

  unitToggle.addEventListener('click', () => {
    unit = unit === 'celsius' ? 'fahrenheit' : 'celsius';
    unitToggle.textContent = unit === 'celsius' ? '°C' : '°F';
    if (weatherData) renderForDate(selectedDateStr);
  });

  function showStatus(msg) {
    dayPickerWrap.innerHTML = '';
    dayPickerWrap.style.boxShadow = 'none';
    contentEl.innerHTML = `<div class="status">${msg}</div>`;
  }

  function computeSolunar(lat, lon, dayStart) {
    const samples = [];
    for (let m = -360; m <= 24 * 60 + 360; m += 5) {
      const t = new Date(dayStart.getTime() + m * 60000);
      const pos = SunCalc.getMoonPosition(t, lat, lon);
      samples.push({ t, alt: pos.altitude });
    }
    const dayEnd = new Date(dayStart.getTime() + 24 * 3600 * 1000);
    const majors = [];
    for (let i = 1; i < samples.length - 1; i++) {
      const { t, alt } = samples[i];
      if (t < dayStart || t > dayEnd) continue;
      const isMax = alt > samples[i - 1].alt && alt > samples[i + 1].alt;
      const isMin = alt < samples[i - 1].alt && alt < samples[i + 1].alt;
      if (isMax || isMin) majors.push({ center: t });
    }
    const moonTimes = SunCalc.getMoonTimes(dayStart, lat, lon);
    const minors = [];
    if (moonTimes.rise) minors.push({ center: moonTimes.rise, label: 'moonrise' });
    if (moonTimes.set) minors.push({ center: moonTimes.set, label: 'moonset' });
    return { majors, minors };
  }

  async function loadLocation(lat, lon, name) {
    lastCoords = { lat, lon, name };
    showStatus('Loading conditions…');

    const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure` +
      `&hourly=temperature_2m,weather_code,surface_pressure,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset` +
      `&past_days=7&forecast_days=16&temperature_unit=celsius&timezone=auto`;

    const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}` +
      `&hourly=wave_height,sea_surface_temperature&past_days=5&forecast_days=8&timezone=auto`;

    try {
      const [forecastRes, marineRes] = await Promise.all([fetch(forecastUrl), fetch(marineUrl).catch(() => null)]);
      if (!forecastRes.ok) throw new Error('forecast failed');
      weatherData = await forecastRes.json();
      marineData = null;
      if (marineRes && marineRes.ok) { try { marineData = await marineRes.json(); } catch (e) { marineData = null; } }
      todayStr = weatherData.current.time.split('T')[0];
      selectedDateStr = todayStr;
      saveLocation({ lat, lon, name });
      buildDayPicker();
      renderForDate(selectedDateStr);
    } catch (err) {
      showStatus("Couldn't load conditions. Check your connection and try again.");
    }
  }

  function buildDayPicker() {
    const dates = weatherData.daily.time;
    const chips = dates.map(d => {
      const isToday = d === todayStr;
      return `<button class="day-chip ${d === selectedDateStr ? 'selected' : ''} ${isToday ? 'is-today' : ''}" data-date="${d}">${chipLabel(d, todayStr)}</button>`;
    }).join('');
    dayPickerWrap.innerHTML = `<div class="day-picker" id="dayPicker">${chips}</div>`;
    document.querySelectorAll('.day-chip').forEach(btn => {
      btn.addEventListener('click', () => selectDate(btn.dataset.date, true));
    });
  }

  function selectDate(dateStr, scrollChipIntoView) {
    selectedDateStr = dateStr;
    document.querySelectorAll('.day-chip').forEach(b => b.classList.toggle('selected', b.dataset.date === dateStr));
    renderForDate(dateStr);
    if (scrollChipIntoView) {
      const chip = document.querySelector(`.day-chip[data-date="${dateStr}"]`);
      if (chip) chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  function shiftDate(delta) {
    const cur = new Date(selectedDateStr + 'T00:00:00');
    cur.setDate(cur.getDate() + delta);
    const newStr = fmtDateStr(cur);
    if (weatherData.daily.time.includes(newStr)) selectDate(newStr, true);
  }

  function findIndexForDateHour(times, dateStr, hh) {
    const exact = `${dateStr}T${hh}`;
    let idx = times.indexOf(exact);
    if (idx !== -1) return idx;
    let best = -1, bestDiff = Infinity;
    const target = new Date(exact);
    times.forEach((t, i) => {
      if (!t.startsWith(dateStr)) return;
      const diff = Math.abs(new Date(t) - target);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    });
    return best;
  }

  // ---- Compute a compact metrics summary for any date (shared by hero panels + compare table) ----
  function computeDayMetrics(dateStr) {
    const isToday = dateStr === todayStr;
    const hourlyTimes = weatherData.hourly.time;

    let repIdx;
    if (isToday) {
      repIdx = hourlyTimes.findIndex(t => t >= weatherData.current.time);
      if (repIdx === -1) repIdx = hourlyTimes.length - 1;
    } else {
      repIdx = findIndexForDateHour(hourlyTimes, dateStr, '12:00');
    }
    if (repIdx === -1) return null;

    const repCode = weatherData.hourly.weather_code[repIdx];
    const repTemp = isToday ? weatherData.current.temperature_2m : weatherData.hourly.temperature_2m[repIdx];
    const desc = describeCode(repCode);

    const pressureNow = isToday ? weatherData.current.surface_pressure : weatherData.hourly.surface_pressure[repIdx];
    const prevDayIdx = repIdx - 24;
    const pressurePrev = prevDayIdx >= 0 ? weatherData.hourly.surface_pressure[prevDayIdx] : null;
    let trend = { label: 'No prior data', cls: 'trend-steady', arrow: '—' };
    if (pressurePrev !== null && pressurePrev !== undefined && pressureNow !== null && pressureNow !== undefined) {
      const diff = pressureNow - pressurePrev;
      if (diff <= -1.5) trend = { label: 'Falling (24h)', cls: 'trend-falling', arrow: '↓' };
      else if (diff >= 1.5) trend = { label: 'Rising (24h)', cls: 'trend-rising', arrow: '↑' };
      else trend = { label: 'Steady (24h)', cls: 'trend-steady', arrow: '→' };
    }

    const windAt = isToday ? weatherData.current.wind_speed_10m : (weatherData.hourly.wind_speed_10m ? weatherData.hourly.wind_speed_10m[repIdx] : null);

    let waterTemp = null, waveHeight = null, marineAvailable = false;
    if (marineData && marineData.hourly) {
      const mTimes = marineData.hourly.time;
      const targetHH = isToday ? (mTimes.find(t => t >= weatherData.current.time) || `${dateStr}T12:00`).split('T')[1] : '12:00';
      const mIdx = findIndexForDateHour(mTimes, dateStr, targetHH);
      if (mIdx !== -1) {
        marineAvailable = true;
        waterTemp = marineData.hourly.sea_surface_temperature ? marineData.hourly.sea_surface_temperature[mIdx] : null;
        waveHeight = marineData.hourly.wave_height ? marineData.hourly.wave_height[mIdx] : null;
      }
    }

    const dailyIdx = weatherData.daily.time.indexOf(dateStr);
    const sunrise = dailyIdx !== -1 ? new Date(weatherData.daily.sunrise[dailyIdx]) : null;
    const sunset = dailyIdx !== -1 ? new Date(weatherData.daily.sunset[dailyIdx]) : null;
    const hi = dailyIdx !== -1 ? weatherData.daily.temperature_2m_max[dailyIdx] : null;
    const lo = dailyIdx !== -1 ? weatherData.daily.temperature_2m_min[dailyIdx] : null;

    const illum = SunCalc.getMoonIllumination(new Date(dateStr + 'T12:00:00'));
    const moonTimesToday = SunCalc.getMoonTimes(new Date(dateStr + 'T00:00:00'), lastCoords.lat, lastCoords.lon);
    const dayStart = new Date(dateStr + 'T00:00:00');
    const solunar = computeSolunar(lastCoords.lat, lastCoords.lon, dayStart);

    return { isToday, repIdx, repTemp, desc, pressureNow, trend, windAt, waterTemp, waveHeight, marineAvailable, sunrise, sunset, hi, lo, illum, moonTimesToday, solunar, dayStart, dailyIdx };
  }

  // ---- Temperature trend chart (1 day / 3 day / week) ----
  function toDisplayTemp(c) {
    if (c === null || c === undefined || isNaN(c)) return null;
    return unit === 'celsius' ? c : (c * 9 / 5 + 32);
  }

  function trendWindowDates(span) {
    const allDates = weatherData.daily.time;
    const idx = Math.max(0, allDates.indexOf(selectedDateStr));
    const before = Math.floor((span - 1) / 2);
    const after = span - 1 - before;
    let start = idx - before, end = idx + after;
    if (start < 0) { end += -start; start = 0; }
    if (end > allDates.length - 1) { start -= (end - (allDates.length - 1)); end = allDates.length - 1; }
    start = Math.max(0, start);
    end = Math.min(allDates.length - 1, end);
    return allDates.slice(start, end + 1);
  }

  function trendCaption(range) {
    if (range === '1') return 'Hourly temperature for the selected day.';
    if (range === '3') return 'Hourly temperature across 3 days, centered on the selected day.';
    return 'Daily high/low range across the week, centered on the selected day.';
  }

  function buildTrendSVG(range) {
    const W = 400, H = 190;
    const padL = 8, padR = 8, plotTop = 14, plotH = 108, axisY = plotTop + plotH + 22;
    const plotW = W - padL - padR;
    const xScale = (t, wStart, wEnd) => {
      const span = wEnd - wStart;
      return padL + (span > 0 ? (t - wStart) / span : 0.5) * plotW;
    };

    if (range === '7') {
      const days = trendWindowDates(7);
      const hi = days.map(d => toDisplayTemp(weatherData.daily.temperature_2m_max[weatherData.daily.time.indexOf(d)]));
      const lo = days.map(d => toDisplayTemp(weatherData.daily.temperature_2m_min[weatherData.daily.time.indexOf(d)]));
      const wStart = new Date(days[0] + 'T00:00:00').getTime();
      const wEnd = new Date(days[days.length - 1] + 'T23:59:59').getTime();
      const xs = days.map(d => xScale(new Date(d + 'T12:00:00').getTime(), wStart, wEnd));
      const allVals = hi.concat(lo).filter(v => v !== null);
      if (allVals.length === 0) return '<div class="status" style="padding:30px 0;">No data available.</div>';
      let minV = Math.min(...allVals), maxV = Math.max(...allVals);
      if (minV === maxV) { minV -= 1; maxV += 1; }
      const pad = (maxV - minV) * 0.15;
      minV -= pad; maxV += pad;
      const yScale = v => plotTop + (1 - (v - minV) / (maxV - minV)) * plotH;

      const hiLine = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${yScale(hi[i])}`).join(' ');
      const loLine = xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${yScale(lo[i])}`).join(' ');
      const bandPts = xs.map((x, i) => `${x},${yScale(hi[i])}`).join(' ') + ' ' +
        xs.slice().reverse().map((x, i) => `${x},${yScale(lo[xs.length - 1 - i])}`).join(' ');

      const dots = xs.map((x, i) => {
        const d = days[i];
        const isSel = d === selectedDateStr;
        const dIdx = weatherData.daily.time.indexOf(d);
        return `
          <circle cx="${x}" cy="${yScale(hi[i])}" r="${isSel ? 4 : 3}" fill="#E3A857" stroke="#fff" stroke-width="1" data-date="${d}" class="trend-dot"><title>${chipLabel(d, todayStr)}: High ${fmtTemp(weatherData.daily.temperature_2m_max[dIdx])}</title></circle>
          <circle cx="${x}" cy="${yScale(lo[i])}" r="${isSel ? 4 : 3}" fill="#4C9F94" stroke="#fff" stroke-width="1" data-date="${d}" class="trend-dot"><title>${chipLabel(d, todayStr)}: Low ${fmtTemp(weatherData.daily.temperature_2m_min[dIdx])}</title></circle>
          ${isSel ? `<line x1="${x}" x2="${x}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="#1C2541" stroke-width="1" stroke-dasharray="2,3" opacity="0.3"/>` : ''}
        `;
      }).join('');

      const labels = xs.map((x, i) => {
        const d = days[i], isToday = d === todayStr;
        const label = isToday ? 'Today' : new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
        return `<text x="${x}" y="${axisY}" text-anchor="middle" font-size="11" fill="${isToday ? '#4C9F94' : '#6B7A99'}" font-family="Work Sans, sans-serif" font-weight="${isToday ? '600' : '400'}">${label}</text>`;
      }).join('');

      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <polygon points="${bandPts}" fill="#4C9F94" opacity="0.12"/>
        <path d="${hiLine}" fill="none" stroke="#E3A857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${loLine}" fill="none" stroke="#4C9F94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}${labels}
      </svg>`;
    }

    // 1-day / 3-day continuous hourly line
    const span = range === '1' ? 1 : 3;
    const days = trendWindowDates(span);
    const wStart = new Date(days[0] + 'T00:00:00').getTime();
    const wEnd = new Date(days[days.length - 1] + 'T23:59:59').getTime();
    const pts = [];
    weatherData.hourly.time.forEach((t, i) => {
      const tm = new Date(t).getTime();
      if (tm >= wStart && tm <= wEnd) pts.push({ t: tm, v: toDisplayTemp(weatherData.hourly.temperature_2m[i]) });
    });
    const vals = pts.map(p => p.v).filter(v => v !== null);
    if (vals.length === 0) return '<div class="status" style="padding:30px 0;">No data available.</div>';
    let minV = Math.min(...vals), maxV = Math.max(...vals);
    if (minV === maxV) { minV -= 1; maxV += 1; }
    const pad = (maxV - minV) * 0.2;
    minV -= pad; maxV += pad;
    const yScale = v => plotTop + (1 - (v - minV) / (maxV - minV)) * plotH;

    const linePts = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xScale(p.t, wStart, wEnd)} ${yScale(p.v)}`).join(' ');
    const areaPts = `M ${xScale(pts[0].t, wStart, wEnd)} ${plotTop + plotH} ` +
      pts.map(p => `L ${xScale(p.t, wStart, wEnd)} ${yScale(p.v)}`).join(' ') +
      ` L ${xScale(pts[pts.length - 1].t, wStart, wEnd)} ${plotTop + plotH} Z`;

    let nowMarker = '';
    const now = new Date(weatherData.current.time).getTime();
    if (now >= wStart && now <= wEnd) {
      const x = xScale(now, wStart, wEnd);
      nowMarker = `<line x1="${x}" x2="${x}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="#1C2541" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>`;
    }

    let ticks;
    if (range === '1') {
      ticks = [0, 6, 12, 18, 24].map(h => ({
        x: xScale(Math.min(wStart + h * 3600000, wEnd), wStart, wEnd),
        label: h === 0 || h === 24 ? '12am' : h === 12 ? '12pm' : (h < 12 ? h + 'am' : (h - 12) + 'pm'),
        isToday: false
      }));
    } else {
      ticks = days.map(d => {
        const isToday = d === todayStr;
        return {
          x: xScale(new Date(d + 'T12:00:00').getTime(), wStart, wEnd),
          label: isToday ? 'Today' : new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' }),
          isToday
        };
      });
    }
    const tickLabels = ticks.map(tk => `<text x="${tk.x}" y="${axisY}" text-anchor="middle" font-size="11" fill="${tk.isToday ? '#4C9F94' : '#6B7A99'}" font-family="Work Sans, sans-serif" font-weight="${tk.isToday ? '600' : '400'}">${tk.label}</text>`).join('');

    const dayDividers = range === '3' ? days.slice(1).map(d => {
      const x = xScale(new Date(d + 'T00:00:00').getTime(), wStart, wEnd);
      return `<line x1="${x}" x2="${x}" y1="${plotTop}" y2="${plotTop + plotH}" stroke="#DDD8CC" stroke-width="1"/>`;
    }).join('') : '';

    const maxPt = pts.reduce((a, b) => (b.v > a.v ? b : a));
    const minPt = pts.reduce((a, b) => (b.v < a.v ? b : a));

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4C9F94" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#4C9F94" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${dayDividers}
      <path d="${areaPts}" fill="url(#trendFill)"/>
      <path d="${linePts}" fill="none" stroke="#1C2541" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${nowMarker}
      <circle cx="${xScale(maxPt.t, wStart, wEnd)}" cy="${yScale(maxPt.v)}" r="3" fill="#E3A857"/>
      <circle cx="${xScale(minPt.t, wStart, wEnd)}" cy="${yScale(minPt.v)}" r="3" fill="#6B7A99"/>
      ${tickLabels}
    </svg>`;
  }

  function renderTrendPanel() {
    const svg = buildTrendSVG(trendRange);
    return `
      <div class="panel trend-panel">
        <div class="trend-header">
          <p class="panel-title">Temperature trend</p>
          <div class="trend-toggle" id="trendToggle">
            <button data-range="1" class="${trendRange === '1' ? 'active' : ''}">1 Day</button>
            <button data-range="3" class="${trendRange === '3' ? 'active' : ''}">3 Day</button>
            <button data-range="7" class="${trendRange === '7' ? 'active' : ''}">Week</button>
          </div>
        </div>
        <div class="trend-chart">${svg}</div>
        <p class="trend-caption">${trendCaption(trendRange)}</p>
      </div>
    `;
  }

  function renderForDate(dateStr) {
    const m = computeDayMetrics(dateStr);
    if (!m) { contentEl.innerHTML = `<div class="status">No weather data available for this date.</div>`; return; }

    const colors = heroColorsFor(m.desc.kind);
    const hourlyTimes = weatherData.hourly.time;
    const minIdxDate = weatherData.daily.time[0];
    const maxIdxDate = weatherData.daily.time[weatherData.daily.time.length - 1];
    const canPrev = dateStr !== minIdxDate;
    const canNext = dateStr !== maxIdxDate;

    const slotHours = ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'];
    const nowHour = m.isToday ? (new Date(weatherData.current.time)).getHours().toString().padStart(2, '0') : null;
    const hourlyHtml = slotHours.map(hh => {
      const idx = findIndexForDateHour(hourlyTimes, dateStr, hh);
      if (idx === -1) return '';
      const d2 = describeCode(weatherData.hourly.weather_code[idx]);
      const t = weatherData.hourly.temperature_2m[idx];
      const isNow = m.isToday && hh.split(':')[0] === nowHour;
      const hLabel = (parseInt(hh) % 12 === 0 ? 12 : parseInt(hh) % 12) + (parseInt(hh) < 12 ? 'AM' : 'PM');
      return `<div class="hour-item ${isNow ? 'is-now' : ''}"><div class="time">${hLabel}</div>${glyphFor(d2.kind, '#1C2541')}<div class="temp">${fmtTemp(t)}</div></div>`;
    }).join('');

    const upcoming = [];
    for (let i = 0; i < weatherData.daily.time.length; i++) {
      if (weatherData.daily.time[i] >= todayStr && upcoming.length < 7) upcoming.push(i);
    }
    const dailyHtml = upcoming.map(i => {
      const d = weatherData.daily.time[i];
      const desc2 = describeCode(weatherData.daily.weather_code[i]);
      return `<div class="daily-row" data-date="${d}"><div class="day">${chipLabel(d, todayStr)}</div>${glyphFor(desc2.kind, '#6B7A99')}<div class="cond">${desc2.text}</div><div class="range"><span>${fmtTemp(weatherData.daily.temperature_2m_max[i])}</span> <span class="lo">${fmtTemp(weatherData.daily.temperature_2m_min[i])}</span></div></div>`;
    }).join('');

    const waterTempHtml = m.marineAvailable && m.waterTemp !== null
      ? `<div class="value">${fmtTemp(m.waterTemp)}</div>`
      : `<div class="value" style="font-size:14px; color:var(--slate); font-weight:400;">${m.marineAvailable ? 'No data' : 'Outside forecast range'}</div>`;
    const waveHtml = m.marineAvailable && m.waveHeight !== null
      ? `<div class="value">${m.waveHeight.toFixed(1)}<span class="unit">m</span></div>`
      : `<div class="value" style="font-size:14px; color:var(--slate); font-weight:400;">${m.marineAvailable ? 'No data' : 'Outside forecast range'}</div>`;

    const condHtml = `
      <div class="cond-grid">
        <div class="cond-item">
          <div class="label">Pressure</div>
          <div class="value">${m.pressureNow ? Math.round(m.pressureNow) : '--'}<span class="unit">hPa</span> <span class="trend-arrow ${m.trend.cls}">${m.trend.arrow}</span></div>
          <div class="note" style="margin-top:2px;">${m.trend.label}</div>
        </div>
        <div class="cond-item">
          <div class="label">Wind</div>
          <div class="value">${m.windAt !== null && m.windAt !== undefined ? Math.round(m.windAt) : '--'}<span class="unit">km/h</span></div>
        </div>
        <div class="cond-item"><div class="label">Water temp</div>${waterTempHtml}</div>
        <div class="cond-item"><div class="label">Wave height</div>${waveHtml}</div>
      </div>
    `;

    const sunMoonHtml = `
      <div class="sunmoon-grid">
        <div class="sunmoon-col">${sunGlyph('#E3A857')}<div class="lines"><div class="t1">${m.sunrise ? clockLabel(m.sunrise) : '--'}</div><div class="t2">Sunrise</div></div></div>
        <div class="sunmoon-col">${sunGlyph('#6B7A99')}<div class="lines"><div class="t1">${m.sunset ? clockLabel(m.sunset) : '--'}</div><div class="t2">Sunset</div></div></div>
        <div class="sunmoon-col">${moonPhaseGlyph(m.illum.phase, '#F5F3EE', '#1C2541')}<div class="lines"><div class="t1">${m.moonTimesToday.rise ? clockLabel(m.moonTimesToday.rise) : '--'}</div><div class="t2">Moonrise</div></div></div>
        <div class="sunmoon-col">${moonPhaseGlyph(m.illum.phase, '#F5F3EE', '#1C2541')}<div class="lines"><div class="t1">${m.moonTimesToday.set ? clockLabel(m.moonTimesToday.set) : '--'}</div><div class="t2">Moonset</div></div></div>
      </div>
      <div class="moon-name">${moonPhaseName(m.illum.phase)} · ${Math.round(m.illum.fraction * 100)}% illuminated</div>
    `;

    const dayMinutes = 24 * 60;
    function blockStyle(center, halfWidthMin, cls) {
      let centerMin = minutesOfDay(center);
      const dayDiff = Math.round((new Date(center.getFullYear(), center.getMonth(), center.getDate()) - m.dayStart) / 86400000);
      centerMin += dayDiff * dayMinutes;
      let left = centerMin - halfWidthMin;
      const clippedLeft = Math.max(0, left);
      const clippedRight = Math.min(dayMinutes, left + halfWidthMin * 2);
      const finalWidth = clippedRight - clippedLeft;
      if (finalWidth <= 0) return '';
      return `<div class="tl-block ${cls}" style="left:${(clippedLeft / dayMinutes) * 100}%; width:${(finalWidth / dayMinutes) * 100}%;"></div>`;
    }
    let tlBlocks = '';
    m.solunar.majors.forEach(mm => { tlBlocks += blockStyle(mm.center, 60, 'tl-major'); });
    m.solunar.minors.forEach(mm => { tlBlocks += blockStyle(mm.center, 30, 'tl-minor'); });
    let nowMarker = '';
    if (m.isToday) {
      const nowDate = new Date(weatherData.current.time);
      nowMarker = `<div class="tl-now" style="left:${(minutesOfDay(nowDate) / dayMinutes) * 100}%;"></div>`;
    }
    const solunarListHtml = [
      ...m.solunar.majors.map(mm => `<div><span class="kind">Major</span> — ${clockLabel(mm.center)} (2h window)</div>`),
      ...m.solunar.minors.map(mm => `<div><span class="kind">Minor</span> — ${clockLabel(mm.center)} (${mm.label})</div>`)
    ].join('');
    const solunarHtml = `
      <div class="timeline-track">${tlBlocks}${nowMarker}</div>
      <div class="tl-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>12am</span></div>
      <div class="solunar-legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--teal);"></span>Major period</div>
        <div class="legend-item"><span class="legend-dot" style="background:#A9CFC8;"></span>Minor period</div>
      </div>
      <div class="solunar-list">${solunarListHtml}</div>
    `;

    const dateLabel = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    const heroTag = m.isToday ? 'Live now' : (dateStr < todayStr ? 'Midday (recorded)' : 'Midday forecast');

    // ---- Compare table across all fetched days ----
    const compareCols = weatherData.daily.time.map(d => {
      const dm = computeDayMetrics(d);
      if (!dm) return '';
      const isSel = d === selectedDateStr;
      const isTod = d === todayStr;
      const majors = dm.solunar.majors.slice(0, 2).map(x => shortClock(x.center)).join('<br>') || '--';
      const waterCell = dm.marineAvailable && dm.waterTemp !== null ? fmtTemp(dm.waterTemp) : '—';
      const waveCell = dm.marineAvailable && dm.waveHeight !== null ? dm.waveHeight.toFixed(1) + 'm' : '—';
      return `
        <div class="compare-col ${isSel ? 'selected' : ''} ${isTod ? 'is-today' : ''}" data-date="${d}">
          <div class="compare-cell date-cell">${chipLabel(d, todayStr)}</div>
          <div class="compare-cell">${glyphFor(dm.desc.kind, '#1C2541')}<span class="sub">${fmtTemp(dm.hi)}/${fmtTemp(dm.lo)}</span></div>
          <div class="compare-cell"><span class="trend-arrow ${dm.trend.cls}">${dm.trend.arrow}</span><span class="sub">${dm.pressureNow ? Math.round(dm.pressureNow) : '--'}</span></div>
          <div class="compare-cell">${dm.windAt !== null && dm.windAt !== undefined ? Math.round(dm.windAt) : '--'}<span class="sub">km/h</span></div>
          <div class="compare-cell">${waterCell}</div>
          <div class="compare-cell">${waveCell}</div>
          <div class="compare-cell">${moonPhaseGlyph(dm.illum.phase, '#1C2541', '#DCE2EC', 18)}</div>
          <div class="compare-cell" style="font-size:10.5px; line-height:1.3;">${majors}</div>
        </div>
      `;
    }).join('');

    const compareHtml = `
      <div class="compare-wrap">
        <div class="compare-labels">
          <div class="compare-row-label">&nbsp;</div>
          <div class="compare-row-label">Hi / Lo</div>
          <div class="compare-row-label">Pressure</div>
          <div class="compare-row-label">Wind</div>
          <div class="compare-row-label">Water</div>
          <div class="compare-row-label">Waves</div>
          <div class="compare-row-label">Moon</div>
          <div class="compare-row-label">Major</div>
        </div>
        <div class="compare-scroll" id="compareScroll"><div class="compare-cols">${compareCols}</div></div>
      </div>
    `;

    contentEl.innerHTML = `
      <div class="hero" style="background:${colors.bg}">
        <div class="hero-nav">
          <button class="hero-arrow" id="prevDayBtn" ${canPrev ? '' : 'disabled'} aria-label="Previous day">‹</button>
          <div>
            <div class="hero-glyph" style="color:${colors.accent}">${glyphFor(m.desc.kind, colors.accent)}</div>
            <p class="hero-location">${lastCoords.name} · ${dateLabel}</p>
            <p class="hero-date-tag">${heroTag}</p>
          </div>
          <button class="hero-arrow" id="nextDayBtn" ${canNext ? '' : 'disabled'} aria-label="Next day">›</button>
        </div>
        <p class="hero-temp">${fmtTemp(m.repTemp)}</p>
        <p class="hero-condition" style="color:${colors.accent}">${m.desc.text}</p>
        <div class="hero-meta"><span>High ${fmtTemp(m.hi)}</span><span>Low ${fmtTemp(m.lo)}</span></div>
      </div>

      ${renderTrendPanel()}

      <p class="section-label">Compare days <span class="sub">scroll to see more →</span></p>
      ${compareHtml}

      <div class="panel"><p class="panel-title">Fishing conditions</p>${condHtml}</div>
      <div class="panel"><p class="panel-title">Sun &amp; moon</p>${sunMoonHtml}</div>
      <div class="panel"><p class="panel-title">Solunar periods</p>${solunarHtml}</div>

      <p class="section-label">Through the day</p>
      <div class="hourly-strip">${hourlyHtml}</div>

      <p class="section-label">This week at a glance</p>
      <div class="daily-list">${dailyHtml}</div>
      <p class="coverage-note">Weather covers roughly the past week through the next two. Sea temp and wave height cover a shorter window since ocean models forecast less far ahead. Moon and solunar times work for any date.</p>
    `;

    document.getElementById('prevDayBtn').addEventListener('click', () => shiftDate(-1));
    document.getElementById('nextDayBtn').addEventListener('click', () => shiftDate(1));

    document.querySelectorAll('#trendToggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        trendRange = btn.dataset.range;
        renderForDate(selectedDateStr);
      });
    });
    document.querySelectorAll('.trend-dot').forEach(dot => {
      dot.addEventListener('click', () => selectDate(dot.dataset.date, true));
    });

    document.querySelectorAll('.daily-row').forEach(row => {
      row.addEventListener('click', () => selectDate(row.dataset.date, true));
    });
    document.querySelectorAll('.compare-col').forEach(col => {
      col.addEventListener('click', () => selectDate(col.dataset.date, true));
    });

    // Keep the selected compare column in view
    const selCol = document.querySelector('.compare-col.selected');
    if (selCol) selCol.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
  }

  // ---- Restore a saved location on load, if any ----
  updateForgetBtn();
  const savedLocation = getSavedLocation();
  if (savedLocation) {
    cityInput.value = savedLocation.name || '';
    loadLocation(savedLocation.lat, savedLocation.lon, savedLocation.name || 'Saved location');
  }
</script>

</body>
</html>
